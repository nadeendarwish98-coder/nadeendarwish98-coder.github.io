const CH=[
{n:'Mr. Bumble',k:'bumble',ch:'12',c:'#5b7fb8',role:'Master of the workhouse',d:['Is now the master of the workhouse where Oliver was born.','Was drinking tea by the fire when a stranger came.','Took two gold coins from the stranger.','Asked Monks for twenty-five pounds for the secret.','Took an old woman to meet Monks by the river.']},
{n:'Monks',k:'stranger',ch:'12 · 13 · 14',c:'#4a4560',role:'The tall, dark stranger',d:['Paid Mr. Bumble to find the old woman.','Gave twenty-five gold coins to hear her secret.','Threw the little bag with the ring into the river.','Came to Fagin’s room with a smile and asked for a word alone.','Wants Fagin to turn Oliver into a thief again.']},

const $=s=>document.querySelector(s),v=$('#view');
const KEY='ot_ch12_14_cards';let S={got:[],best:0};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let AC;function tone(f,d=.15,t='sine',vol=.1,dl=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime+dl);g.gain.linearRampToValueAtTime(vol,AC.currentTime+dl+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dl+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+dl);o.stop(AC.currentTime+dl+d+.05)}catch(e){}}
const sfx={flip:()=>{tone(380,.08,'triangle',.08);tone(520,.1,'triangle',.07,.07)},ok:()=>{tone(660,.14);tone(990,.22,'sine',.1,.1)},bad:()=>{tone(220,.25,'triangle',.1);tone(180,.3,'triangle',.08,.12)},win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.26,'sine',.1,i*.13)),tap:()=>tone(520,.06,'sine',.05)};
function confetti(n){const c=['#d9a441','#f2cf7a','#b3262e','#fff','#7fb8c8'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDuration=(2+Math.random()*2)+'s';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
const art=(c,full)=>c.k?`<svg viewBox="${full?'-46 -152 92 160':'-34 -150 68 90'}" preserveAspectRatio="xMidYMax meet">${fig(c.k,0,0,1,{d:0})}</svg>`:`<svg class="ic" viewBox="0 0 48 48">${ICON[c.e]}</svg>`;
const hd=c=>c.k?`<svg viewBox="-32 -${PPL[c.k].top?150:128} 64 ${PPL[c.k].top?78:66}">${fig(c.k,0,0,1,{d:0})}</svg>`:`<svg viewBox="0 0 48 48">${ICON[c.e]}</svg>`;
const upd=()=>$('#cnt').textContent='🗂 '+S.got.length+' / '+CH.length;
let mode='deck';
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');mode=t.dataset.m;sfx.tap();render()});
function render(){upd();window.scrollTo(0,0);({deck,quiz,coll})[mode]()}
function deck(){
 let h='<p class="hint">Tap a file to open it and read about the character. Open all ten to complete your collection!</p><div class="grid">';
 CH.forEach(c=>{h+=`<div class="card" data-n="${c.n}" style="--c:${c.c}"><div class="in"><div class="f"><div class="clip"></div><div class="ph">${art(c)}<span class="tag">CH ${c.ch}</span></div><div class="nm"><b>${c.n}</b><span>${c.role}</span></div><div class="tap">tap to open the file</div></div><div class="b"><h3>${c.n}</h3><div class="rl">${c.role}</div><ul>${c.d.map(x=>`<li>${x}</li>`).join('')}</ul><div class="stamp">CASE FILE</div><div class="tap">tap to close</div></div></div></div>`});
 v.innerHTML=h+'</div>';
 v.querySelectorAll('.card').forEach(k=>k.onclick=()=>{k.classList.toggle('flip');sfx.flip();const n=k.dataset.n;if(k.classList.contains('flip')&&!S.got.includes(n)){S.got.push(n);save();upd();if(S.got.length==CH.length){sfx.win();confetti(60)}}});
}
function quiz(){
 const pool=shuf(CH).slice(0,8);let i=0,ok=0;
 const q=()=>{
  if(i>=pool.length){S.best=Math.max(S.best||0,ok);save();const st=ok>=7?3:ok>=5?2:1;v.innerHTML=`<div class="panel center"><div class="bigs">${'★'.repeat(st)}<i>${'★'.repeat(3-st)}</i></div><h2>${ok} out of ${pool.length}</h2><p>${st==3?'Top detective! You know every character.':st==2?'Great work! Read the files again and try once more.':'Good try! Open the files and play again.'}</p><button class="btn" id="ag">Play again ↻</button> <button class="btn" id="bk">Back to the files</button></div>`;st==3?sfx.win():sfx.tap();if(st==3)confetti(60);$('#ag').onclick=()=>{sfx.tap();quiz()};$('#bk').onclick=()=>{document.querySelector('[data-m=deck]').click()};return}
  const c=pool[i],clue=c.d[Math.random()*c.d.length|0];
  const o=shuf([c,...shuf(CH.filter(x=>x!==c)).slice(0,3)]);
  v.innerHTML=`<div class="bar"><i style="width:${i/pool.length*100}%"></i></div><div class="panel"><span class="lab">WHO AM I? · ${i+1} OF ${pool.length}</span><div class="clue">${c.k?'':'This is about me: '}“${clue}”</div><div class="opts">${o.map(x=>`<button class="opt" data-n="${x.n}">${x.n}</button>`).join('')}</div><div id="fb"></div></div>`;
  let done=false;
  v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const right=b.dataset.n==c.n;if(right){ok++;sfx.ok()}else sfx.bad();
   v.querySelectorAll('.opt').forEach(x=>{x.classList.add('lock');if(x.dataset.n==c.n)x.classList.add('ok');else if(x===b)x.classList.add('no');else x.classList.add('dim')});
   $('#fb').innerHTML=`<div class="reveal">${hd(c)}<p><b>${right?'Yes!':'It was'} ${c.n}</b> — ${c.role}.</p></div><div class="center"><button class="btn" id="nx">${i+1>=pool.length?'See my result ★':'Next ➜'}</button></div>`;
   $('#nx').onclick=()=>{sfx.tap();i++;q()};$('#nx').scrollIntoView({block:'nearest'})});
 };q();
}
function coll(){
 v.innerHTML=`<p class="hint">Open a file in “The Files” to add it here. You have <b>${S.got.length}</b> of ${CH.length}!</p><div class="slots">${CH.map(c=>S.got.includes(c.n)?`<div class="mini" style="--c:${c.c}">${hd(c)}${c.n}</div>`:`<div class="mini lock"><div class="q">?</div>Closed file</div>`).join('')}</div>${S.best?`<p class="hint" style="margin-top:18px">Best “Who Am I?” score: ${S.best} / 8</p>`:''}`;
}
render();
