<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oliver Twist Adventure — Nadeen's Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Lora:wght@500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1d14;--paper:#efe2c6;--paper2:#f7eed8;--brown:#5b3a29;--brown2:#3b2519;--gold:#c19a4b;--gold2:#e2c071;--burg:#7a2f3a;--green:#4b6b4a;--night:#1d2140;--muted:#7b6650}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 0,#6a4a35 0,#2f1f16 70%) fixed;color:var(--ink);font-family:'Lora',Georgia,serif;min-height:100vh;user-select:none}
.ar{font-family:'Cairo','Tahoma',sans-serif;direction:rtl}
#hud{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(#2a1a11,#3b2519);border-bottom:3px solid var(--gold);color:var(--paper)}
#hud a,#hud button{font:inherit;color:var(--paper);background:none;border:1px solid #8a6b3d;border-radius:999px;padding:5px 13px;text-decoration:none;cursor:pointer;font-size:14px;font-weight:600}
#hud a:hover,#hud button:hover{background:#4d3424}
#hud .ttl{flex:1;text-align:center;font-family:'Playfair Display',serif;font-weight:800;letter-spacing:.5px;color:var(--gold2);font-size:17px}
#hud .stars{color:var(--gold2);font-weight:700}
#app{max-width:980px;margin:0 auto;padding:18px 14px 60px}
.panel{background:linear-gradient(var(--paper2),var(--paper));border:3px solid var(--gold);border-radius:18px;box-shadow:0 0 0 6px #3b2519,0 14px 34px rgba(0,0,0,.5);padding:20px;position:relative}
h1,h2,h3{font-family:'Playfair Display',serif;margin:0;color:var(--brown2)}
.btn{font:inherit;font-weight:700;font-size:17px;cursor:pointer;color:#fff3d6;background:linear-gradient(#8a5a3a,#5b3a29);border:2px solid var(--gold);border-radius:12px;padding:11px 24px;box-shadow:0 4px 0 #2d1b11;transition:transform .08s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2d1b11}
.btn.alt{background:linear-gradient(#f7eed8,#e3d3ae);color:var(--brown2)}
.btn[disabled]{opacity:.45;cursor:default}
.scene{width:100%;height:auto;display:block;border-radius:12px;border:3px solid var(--brown)}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.flick{animation:flick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.9,1.12)}70%{transform:scale(1.06,.94)}}
.drift{animation:drift 60s linear infinite}@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(920px)}}
.tw{animation:tw 2.5s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.smoke{animation:smoke 4s ease-out infinite}@keyframes smoke{from{opacity:.55;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(14px,-40px) scale(1.5)}}
/* title */
.hero{text-align:center}
.hero h1{font-size:clamp(34px,7vw,64px);font-weight:900;line-height:1;margin:12px 0 4px;color:var(--brown2);text-shadow:0 2px 0 #fff4d6}
.hero .sub{font-style:italic;color:var(--muted);font-size:19px;margin-bottom:14px}
.hero input{font:inherit;font-size:17px;padding:10px 14px;border:2px solid var(--gold);border-radius:10px;background:#fffaf0;text-align:center;width:min(300px,80%);margin:8px 0 16px}
.orn{color:var(--gold);letter-spacing:10px;font-size:22px}
/* map */
.maphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.map{width:100%;height:auto;display:block;border-radius:12px;border:3px solid var(--brown);background:#d8c9a4}
.node{cursor:pointer}.node.locked{cursor:not-allowed}
.node .pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.4}}
/* stage */
.stagegrid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media(max-width:760px){.stagegrid{grid-template-columns:1fr}}
.chap{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--burg);font-weight:700}
.story{font-size:18px;line-height:1.55;margin:8px 0}
.storyar{font-size:16px;line-height:1.7;color:var(--muted);margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:#fffaf0;border:1.5px solid var(--gold);border-radius:999px;padding:4px 12px;font-size:14px}
.chip b{color:var(--burg)}
.how{background:#3b2519;color:var(--paper);border-radius:10px;padding:10px 14px;font-size:15px;margin:10px 0}
.how b{color:var(--gold2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gbox .gt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.gbox .gt h2{font-size:22px}
.pill{background:#3b2519;color:var(--gold2);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.pad{display:flex;gap:14px;justify-content:center;margin-top:14px}
.big{font:inherit;font-weight:800;font-size:20px;padding:16px 28px;border-radius:14px;cursor:pointer;color:#fff3d6;background:linear-gradient(#8a5a3a,#5b3a29);border:3px solid var(--gold);box-shadow:0 5px 0 #2d1b11;min-width:140px}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #2d1b11}
.meter{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700}
.bar{flex:1;height:16px;background:#d8c7a0;border:2px solid var(--brown);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9a34a,#b23a3a);transition:width .25s}
.bar.good i{background:linear-gradient(90deg,#8bb26a,#4b6b4a)}
.goal{background:#3b2519;color:var(--gold2);border-radius:10px;padding:9px 14px;font-weight:700;font-size:18px;text-align:center;margin-bottom:12px}
.hint{text-align:center;color:var(--muted);font-style:italic;margin:8px 0 0;min-height:24px}
.kbar{position:relative;height:40px;margin:14px 0 6px;background:#d8c7a0;border:3px solid var(--brown);border-radius:10px;overflow:hidden}
.kbar .zone{position:absolute;top:0;bottom:0;background:rgba(75,107,74,.75);border-left:3px solid #2f4b2e;border-right:3px solid #2f4b2e}
.kbar .needle{position:absolute;top:-2px;bottom:-2px;width:6px;background:var(--burg);border-radius:3px}
.shake{animation:shake .35s}@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.cols{grid-template-columns:1fr}}
.qcard,.opt,.tile,.evt{font:inherit;cursor:pointer;background:#fffaf0;border:2px solid #b89a5a;border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);font-size:16px;line-height:1.35;transition:transform .1s,background .15s}
.qcard:hover,.opt:hover:not([disabled]),.evt:hover:not([disabled]),.tile:hover{transform:translateY(-2px);background:#fff3d6}
.qcard.sel{background:#ffe8a8;border-color:var(--burg)}.qcard.done,.evt.done{background:#d6e6c6;border-color:var(--green);cursor:default;opacity:.75}
.qcard.done:hover{transform:none}
.who{font:inherit;cursor:pointer;background:#fffaf0;border:2px solid #b89a5a;border-radius:12px;padding:2px 4px 6px;text-align:center;font-weight:700;color:var(--brown2)}
.who.done{background:#d6e6c6;border-color:var(--green);cursor:default}.who:hover:not(.done){background:#fff3d6}
.whoGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timeline{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tl{display:flex;gap:8px;align-items:center;background:#e8dcc0;border:2px dashed #b89a5a;border-radius:10px;padding:7px 10px;min-height:38px;font-size:15px}
.tl.f{background:#d6e6c6;border:2px solid var(--green)}.tl .n{width:26px;height:26px;border-radius:50%;background:var(--brown);color:var(--gold2);display:grid;place-items:center;font-weight:700;flex:none}
.find{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.find>span{background:#fffaf0;border:2px solid #b89a5a;border-radius:10px;padding:4px 10px;font-size:15px}
.find>span.ok{background:#d6e6c6;border-color:var(--green);text-decoration:line-through;opacity:.8}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.memgrid{grid-template-columns:repeat(3,1fr)}}
.mc{aspect-ratio:1/1.05;perspective:600px;cursor:pointer}
.mc>div{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.flip>div,.mc.ok>div{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--gold);text-align:center;padding:4px}
.mc .b{background:repeating-linear-gradient(45deg,#7a2f3a 0 8px,#6a2630 8px 16px);color:var(--gold2);font-family:'Playfair Display',serif;font-size:30px;font-weight:900}
.mc .f{background:#fffaf0;transform:rotateY(180deg);font-weight:700;font-size:17px;color:var(--brown2)}
.mc.ok .f{background:#d6e6c6;border-color:var(--green)}
.keys{display:flex;gap:6px;justify-content:center;margin-top:14px}
.key{width:min(17vw,86px);height:150px;border-radius:0 0 10px 10px;border:3px solid #2d1b11;background:linear-gradient(#fffaf0,#e9dcc0);cursor:pointer;font:inherit;font-weight:800;color:var(--brown2);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:20px;box-shadow:0 5px 0 #2d1b11}
.key.lit{background:linear-gradient(#ffe7a0,#e8b94e);transform:translateY(4px);box-shadow:0 1px 0 #2d1b11}
.opts{display:grid;gap:10px;margin-top:12px}
.fb{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:16px}.fb.ok{background:#d6e6c6;border:2px solid var(--green)}.fb.no{background:#f2d3cf;border:2px solid var(--burg)}
.opt.right{background:#d6e6c6;border-color:var(--green)}.opt.wrong{background:#f2d3cf;border-color:var(--burg)}
.q{font-size:20px;font-weight:600;margin:6px 0}
.tilesrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.slot{width:46px;height:54px;border-bottom:4px solid var(--brown);display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:30px;font-weight:800;color:var(--burg)}
.tile{width:50px;height:56px;text-align:center;padding:0;font-family:'Playfair Display',serif;font-size:28px;font-weight:800;box-shadow:0 4px 0 #8a6b3d}
.tile.used{visibility:hidden}
.hearts{letter-spacing:3px;color:var(--burg);font-size:20px}
.wrapA{position:relative}
.dark{position:absolute;inset:0;border-radius:12px;pointer-events:none;background:radial-gradient(circle 150px at var(--x,50%) var(--y,50%),rgba(0,0,0,0) 0,rgba(4,6,20,.74) 100%)}
.modal{position:fixed;inset:0;background:rgba(10,5,2,.78);display:grid;place-items:center;z-index:50;padding:16px}
.modal .panel{max-width:520px;width:100%;text-align:center}
.bigstars{font-size:52px;color:var(--gold);letter-spacing:6px;text-shadow:0 3px 0 #5b3a29}
.bigstars .off{color:#c9b890}
.card12{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.sc{background:#fffaf0;border:3px solid var(--gold);border-radius:12px;padding:6px;font-size:14px}
.sc svg{border-radius:8px;border:2px solid var(--brown);width:100%;height:auto;display:block}
.sc.lock svg{filter:grayscale(1) brightness(.35) blur(2px)}
.sc p{margin:6px 4px 2px;line-height:1.35}
.cert{border:10px double var(--gold);background:#fffaf0;padding:26px 18px;text-align:center;border-radius:6px}
.cert h1{font-size:clamp(26px,5vw,44px)}
.cert .bigstars{line-height:1.2;margin:8px 0}
.cert .nm{font-family:'Playfair Display',serif;font-size:clamp(28px,6vw,48px);font-weight:800;color:var(--burg);border-bottom:2px solid var(--gold);display:inline-block;padding:0 22px;margin:10px 0}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:60;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media print{body{background:#fff}#hud,.noprint{display:none!important}.panel{box-shadow:none;border:none}}
</style>
</head>
<body>
<div id="hud">
  <a href="../index.html" title="Back to Learning Hub">🏠 Home</a>
  <div class="ttl">Oliver Twist Adventure</div>
  <span class="stars" id="hs">★ 0</span>
  <button id="mute" title="Sound">🔊</button>
</div>
<div id="app"></div>

<script>
/* ============================== helpers ============================== */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let _u=0;const uid=()=>'u'+(++_u);
let state=(()=>{try{return JSON.parse(localStorage.getItem('ot_adv_v1'))||{stars:{},name:''}}catch(e){return{stars:{},name:''}}})();
const save=()=>{try{localStorage.setItem('ot_adv_v1',JSON.stringify(state))}catch(e){}};
const P=new URLSearchParams(location.search);
const total=()=>Object.values(state.stars).reduce((a,b)=>a+b,0);
const updHUD=()=>{$('#hs').textContent='★ '+total()+' / 36'};
let cleanup=()=>{};
function go(fn){try{cleanup()}catch(e){};cleanup=()=>{};window.scrollTo(0,0);fn();updHUD()}

/* ============================== sound ============================== */
let AC=null,muted=false;
function tone(f,d=.15,type='sine',v=.12,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.03)}catch(e){}}
const sfx={ok:()=>{tone(660,.12);tone(880,.2,'sine',.12,.09)},bad:()=>tone(150,.28,'sawtooth',.08),knock:()=>{tone(95,.09,'square',.22);tone(90,.09,'square',.2,.14)},step:()=>tone(220,.06,'triangle',.1),
 win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.13,i*.13)),pop:()=>tone(520,.08,'sine',.1),jump:()=>{tone(300,.12,'square',.07);tone(450,.12,'square',.06,.07)}};
$('#mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊';if(muted&&window.speechSynthesis)speechSynthesis.cancel()};
function speak(t){if(muted||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}

/* ============================== art kit ============================== */
const C={ink:'#2a1d14',gold:'#c19a4b',burg:'#7a2f3a',brick:'#9a5444',brickd:'#78402f',slate:'#585a66',wood:'#7a563a',woodd:'#563c2a',stone:'#aaa294',cream:'#e8dcc0'};
const sv=(inner,cls='scene',vb='0 0 800 420')=>`<svg class="${cls}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const lg=(id,a,b)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const rg=(id,c,o=.6)=>`<radialGradient id="${id}"><stop offset="0" stop-color="${c}" stop-opacity="${o}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
function hills(y,amp,col,f=2,ph=0){let d=`M0 420 L0 ${y+amp*Math.sin(ph)}`;for(let x=0;x<=800;x+=20)d+=` L${x} ${(y+amp*Math.sin(x/800*f*Math.PI+ph)).toFixed(1)}`;return `<path d="${d} L800 420Z" fill="${col}"/>`}
function tree(x,y,s=1,c='#4d6e48',dim=1){const m=n=>{const v=parseInt(n.slice(1),16);return '#'+[v>>16,(v>>8)&255,v&255].map(q=>Math.round(q*dim).toString(16).padStart(2,'0')).join('')};
 return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-6" y="-60" width="12" height="60" fill="${m('#6a4a34')}"/><circle cx="0" cy="-95" r="40" fill="${m(c)}"/><circle cx="-28" cy="-72" r="30" fill="${m(c)}"/><circle cx="28" cy="-70" r="31" fill="${m(c)}"/><circle cx="-10" cy="-112" r="18" fill="${m('#6b8c5e')}" opacity=".7"/></g>`}
function cottage(x,y,s=1,lit=false,k=uid(),dim=1){const win=lit?'#ffd37a':'#9fb6c4';
 return `<g transform="translate(${x},${y}) scale(${s})"><defs><pattern id="${k}" width="22" height="9" patternUnits="userSpaceOnUse"><rect width="22" height="9" fill="${C.brick}"/><path d="M0 .5H22M0 4.5v4.5M11 4.5v4.5M0 9H22" stroke="#cdbb9e" stroke-width="1" fill="none"/><path d="M11 0v4.5" stroke="#cdbb9e" stroke-width="1"/></pattern></defs>
 <rect x="0" y="-190" width="400" height="190" fill="url(#${k})"/><rect x="0" y="-190" width="400" height="190" fill="#000" opacity="${(1-dim)*.5}"/>
 <path d="M-24 -184 L200 -312 L424 -184Z" fill="${C.slate}"/><path d="M-10 -196 L200 -300 L410 -196" fill="none" stroke="#3e404a" stroke-width="3" opacity=".5"/>
 <rect x="70" y="-290" width="26" height="60" fill="${C.brickd}"/><rect x="66" y="-296" width="34" height="10" fill="#5f3022"/><rect x="310" y="-290" width="26" height="60" fill="${C.brickd}"/><rect x="306" y="-296" width="34" height="10" fill="#5f3022"/>
 ${[[40,-150],[280,-150]].map(([a,b])=>`<rect x="${a-5}" y="${b-5}" width="90" height="90" fill="#f1ecdf"/><rect x="${a}" y="${b}" width="80" height="80" fill="${win}"/><path d="M${a+40} ${b}v80M${a} ${b+27}h80M${a} ${b+54}h80" stroke="#f1ecdf" stroke-width="4"/>`).join('')}
 <rect x="170" y="-122" width="60" height="122" rx="6" fill="${C.woodd}"/><path d="M170 -122a30 22 0 0 1 60 0" fill="${C.woodd}"/><circle cx="220" cy="-56" r="4" fill="${C.gold}"/><rect x="156" y="-4" width="88" height="8" fill="${C.stone}"/>
 ${[0,1,2,3,4,5,6].map(i=>`<circle cx="${10+(i%2)*6}" cy="${-20-i*22}" r="${9+i%3*2}" fill="#46683f" opacity=".9"/><circle cx="${390-(i%2)*6}" cy="${-30-i*20}" r="${9+i%3*2}" fill="#46683f" opacity=".9"/>`).join('')}
 ${[0,1,2,3,4].map(i=>`<circle cx="${120+i*18}" cy="${-8-(i%2)*8}" r="12" fill="#4e7048"/><circle cx="${120+i*18}" cy="${-12-(i%2)*8}" r="3.4" fill="#b84a58"/>`).join('')}</g>`}
function stoneWall(y,h=34,x0=0,x1=800,gaps=[]){let o='';for(let x=x0;x<x1;x+=28){if(gaps.some(g=>x>=g[0]&&x<g[1]))continue;o+=`<rect x="${x}" y="${y-h}" width="28" height="${h}" fill="${C.stone}" stroke="#847c6e" stroke-width="1.4"/><rect x="${x+2}" y="${y-h+2}" width="10" height="5" fill="#fff" opacity=".18"/>`}return o}
function candle(x,y,glow=true,k=uid()){return `${glow?`<defs>${rg(k,'#ffd27a',.7)}</defs><circle cx="${x}" cy="${y-8}" r="70" fill="url(#${k})" class="flick"/>`:''}<rect x="${x-10}" y="${y+16}" width="20" height="5" fill="${C.gold}"/><rect x="${x-3}" y="${y+4}" width="6" height="14" fill="${C.gold}"/><rect x="${x-5}" y="${y-12}" width="10" height="18" fill="#f4ecd6"/><path d="M${x-3} ${y-12}q3-14 3-18 0 5 3 18z" fill="#f4a73a" class="flick"/><path d="M${x-1.5} ${y-12}q1.5-8 3 0z" fill="#fff0a8"/>`}

const GAMES={};

GAMES.stepper=(b,st,done,hud)=>{
 const N=18;let n=0,last=null,mist=0,fin=false;
 b.innerHTML=`<div id="sa"></div><div class="meter"><span>Pain</span><div class="bar"><i id="pb"></i></div></div><div class="pad"><button class="big" id="fl">◀ LEFT foot</button><button class="big" id="fr">RIGHT foot ▶</button></div><p class="hint" id="hn">Left… right… keep going!</p>`;
 const draw=()=>{const f=n/N;$('#sa').innerHTML=sceneSVG('road',[['oliver',130+f*430,396-f*70,1.5-f*.8,{e:mist>2?'scared':'sad',d:0}]])};
 const step=side=>{if(fin)return;if(last===side){mist++;sfx.bad();shake($('#sa'));$('#hn').textContent='Ouch! Use the OTHER foot!'}else{n++;sfx.step();$('#hn').textContent=['Left… right…','Slowly, slowly…','Nearly there!'][n%3]}last=side;$('#pb').style.width=Math.min(100,mist*18)+'%';hud(n+' / '+N+' steps');draw();
  if(n>=N){fin=true;$('#hn').textContent='Oliver reached the house!';setTimeout(()=>done(starsBy(mist,1,3)),700)}};
 $('#fl').onclick=()=>step('L');$('#fr').onclick=()=>step('R');
 const kd=e=>{if(e.key=='ArrowLeft'||e.key=='a')step('L');if(e.key=='ArrowRight'||e.key=='d')step('R')};document.addEventListener('keydown',kd);cleanup=()=>document.removeEventListener('keydown',kd);
 draw();hud('0 / '+N+' steps');
};

GAMES.knock=(b,st,done,hud)=>{
 let hits=0,miss=0,t0=performance.now(),raf,fin=false,ctr=.5,w=.26;
 b.innerHTML=`<div id="sa">${sceneSVG('gate',[['oliver',290,404,1.3,{e:'sad'}]])}</div><div class="kbar" id="kb"><div class="zone" id="zn"></div><div class="needle" id="nd"></div></div><div class="pad"><button class="big" id="kn">KNOCK!</button></div><p class="hint" id="hn">Wait for the needle…</p>`;
 const zone=()=>{w=[.28,.2,.15][Math.min(hits,2)];ctr=rnd(.25,.75);const z=$('#zn');z.style.left=(ctr-w/2)*100+'%';z.style.width=w*100+'%'};
 let pos=0;const loop=t=>{const sp=1.9+hits*.7;pos=(Math.sin((t-t0)/1000*sp)+1)/2;$('#nd').style.left=`calc(${pos*100}% - 3px)`;raf=requestAnimationFrame(loop)};
 const hit=()=>{if(fin)return;if(Math.abs(pos-ctr)<=w/2){hits++;sfx.knock();$('#hn').textContent='TOK TOK! '+hits+' / 3';if(hits>=3){fin=true;cancelAnimationFrame(raf);$('#sa').innerHTML=sceneSVG('gate',[['oliver',290,404,1.3,{e:'sad'}]]).replace(/<g transform="translate\(290,404\)[^>]*>/,m=>m.replace(')',') rotate(80)'));setTimeout(()=>done(starsBy(miss,1,3)),900)}else zone()}else{miss++;sfx.bad();shake($('#kb'));$('#hn').textContent='Too early or too late — try again!'}hud(hits+' / 3 knocks')};
 $('#kn').onclick=hit;const kd=e=>{if(e.code=='Space'){e.preventDefault();hit()}};document.addEventListener('keydown',kd);
 cleanup=()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',kd)};zone();raf=requestAnimationFrame(loop);hud('0 / 3 knocks');
};

 const svg=b.querySelector('svg');
 svg.querySelectorAll('.obj').forEach(g=>g.addEventListener('click',e=>{e.stopPropagation();const k=g.dataset.k;if(found.has(k))return;found.add(k);sfx.ok();$('#f_'+k).classList.add('ok');g.insertAdjacentHTML('beforeend','<circle cx="24" cy="24" r="30" fill="none" stroke="#4b6b4a" stroke-width="4"/>');hud(found.size+' / 6');$('#hn').textContent='Found it!';if(found.size>=6)setTimeout(()=>done(starsBy(mist,2,5)),800)}));
 svg.addEventListener('click',()=>{if(found.size>=6)return;mist++;sfx.bad();shake(svg);$('#hn').textContent='Nothing there… ('+mist+' wrong taps)'});
 hud('0 / 6');
};

GAMES.memory=(b,st,done,hud)=>{
 const pr=[['book','book'],['piano','piano'],['flower','flowers'],['bird','bird'],['cup','tea'],['walk','walk']];
 let cards=shuffle(pr.flatMap((p,i)=>[{i,t:'ic'},{i,t:'w'}]));let open=[],moves=0,ok=0,lock=false;
 b.innerHTML=`<div class="memgrid">${cards.map((c,x)=>`<div class="mc" data-x="${x}"><div><div class="b">❦</div><div class="f">${c.t=='ic'?iconSvg(pr[c.i][0]):`<span style="font-size:22px">${pr[c.i][1]}</span>`}</div></div></div>`).join('')}</div><p class="hint" id="hn">Find the pairs.</p>`;
 document.querySelectorAll('.mc').forEach(m=>m.onclick=()=>{const x=+m.dataset.x;if(lock||m.classList.contains('flip')||m.classList.contains('ok'))return;m.classList.add('flip');sfx.pop();open.push(x);
  if(open.length==2){moves++;hud(moves+' moves');const [a,c]=open,A=cards[a],B=cards[c];if(A.i==B.i&&A.t!=B.t){ok++;document.querySelectorAll('.mc')[a].classList.add('ok');document.querySelectorAll('.mc')[c].classList.add('ok');sfx.ok();open=[];if(ok>=6)setTimeout(()=>done(starsBy(moves,8,12)),800)}else{lock=true;setTimeout(()=>{document.querySelectorAll('.mc')[a].classList.remove('flip');document.querySelectorAll('.mc')[c].classList.remove('flip');open=[];lock=false},800)}}});
 hud('0 moves');
};

GAMES.simon=(b,st,done,hud)=>{
 const notes=[[262,'C','#d9a3a3'],[294,'D','#e0c58a'],[330,'E','#b7d1a0'],[392,'G','#9fc4d8'],[440,'A','#c6aee0']];
 let seq=[],round=0,idx=0,mist=0,accept=false;const R=5;
 b.innerHTML=`<div id="sa">${sceneSVG('piano',[['rose',520,404,1.3,{e:'happy'}]])}</div><div class="keys">${notes.map((n,i)=>`<button class="key" data-i="${i}" style="background:linear-gradient(#fffaf0,${n[2]})">${n[1]}</button>`).join('')}</div><p class="hint" id="hn"></p>`;
 const keys=[...document.querySelectorAll('.key')];
 const lit=(i,d=380)=>{keys[i].classList.add('lit');tone(notes[i][0],.4,'triangle',.18);setTimeout(()=>keys[i].classList.remove('lit'),d)};
 const play=()=>{accept=false;$('#hn').textContent='Listen…';let k=0;const iv=setInterval(()=>{if(k>=seq.length){clearInterval(iv);accept=true;idx=0;$('#hn').textContent='Your turn! Play it back.';return}lit(seq[k]);k++},650)};
 const nextRound=()=>{round++;hud('Round '+round+' / '+R);while(seq.length<round+1)seq.push(Math.floor(Math.random()*5));setTimeout(play,700)};
 keys.forEach(k=>k.onclick=()=>{if(!accept)return;const i=+k.dataset.i;lit(i,250);if(i==seq[idx]){idx++;if(idx>=seq.length){accept=false;sfx.ok();if(round>=R){$('#hn').textContent='Beautiful music!';setTimeout(()=>done(mist==0?3:mist<=2?2:1),800)}else{$('#hn').textContent='Lovely! A longer tune now…';nextRound()}}}else{mist++;accept=false;sfx.bad();shake($('#sa'));$('#hn').textContent='Oops! Listen again…';setTimeout(play,900)}});
 const kd=e=>{const m={a:0,s:1,d:2,f:3,g:4,1:0,2:1,3:2,4:3,5:4}[e.key];if(m!=null)keys[m].click()};document.addEventListener('keydown',kd);cleanup=()=>document.removeEventListener('keydown',kd);
 nextRound();
};

GAMES.runner=(b,st,done,hud)=>{
 const DUR=28;let t=0,vy=0,y=0,hearts=3,inv=0,raf,last=0,fin=false,obs=[],nextSp=1.2,over=false;
 b.innerHTML=`<div id="sa"></div><div class="row" style="justify-content:space-between;margin-top:8px"><span class="hearts" id="hr">♥♥♥</span><div class="bar good" style="flex:1;margin-left:12px"><i id="pg"></i></div></div><p class="hint" id="hn">Tap to jump!</p>`;
 const sa=$('#sa');const base=sceneInner('fields');
 sa.innerHTML=sv(base+`<rect y="372" width="800" height="48" fill="#6f8a4e"/><g id="gr" stroke="#4d6a38" stroke-width="3">${[...Array(14)].map((_,i)=>`<path d="M${i*70} 400h30"/>`).join('')}</g><g id="ob"></g><g id="pl"></g><g transform="translate(700,300)"><rect x="0" y="0" width="90" height="75" fill="#e8dcc0"/><path d="M-10 0L45 -34 100 0z" fill="#9a5a46"/><rect x="34" y="30" width="22" height="45" fill="#563c2a"/></g>`);
 const pl=$('#pl'),ob=$('#ob'),gr=$('#gr');
 const jump=()=>{if(fin||over)return;if(y<=2){vy=640;sfx.jump()}};
 sa.addEventListener('pointerdown',jump);const kd=e=>{if(e.code=='Space'||e.key=='ArrowUp'){e.preventDefault();jump()}};document.addEventListener('keydown',kd);
 const spawn=()=>{const k=Math.random();obs.push(k<.4?{x:820,w:34,h:42,type:'fence'}:k<.75?{x:820,w:30,h:26,type:'stone'}:{x:820,w:70,h:8,type:'pud'})};
 const loop=ts=>{if(!last)last=ts;const dt=Math.min(.04,(ts-last)/1000);last=ts;
  if(!fin&&!over){t+=dt;const sp=250+t*5;nextSp-=dt;if(nextSp<=0){spawn();nextSp=rnd(1.05,1.8)*(250/sp)*1.1}
   vy-=1700*dt;y=Math.max(0,y+vy*dt);if(y==0&&vy<0)vy=0;inv=Math.max(0,inv-dt);
   obs.forEach(o=>o.x-=sp*dt);obs=obs.filter(o=>o.x>-100);
   for(const o of obs){if(!o.hit&&o.x<160+14&&o.x+o.w>160-14&&y<o.h-4){o.hit=1;if(inv<=0){hearts--;inv=1.1;sfx.bad();$('#hr').textContent='♥'.repeat(Math.max(0,hearts))+'♡'.repeat(3-Math.max(0,hearts));shake(sa);if(hearts<=0){over=true;$('#hn').textContent='Oh no! Oliver is too tired…';b.insertAdjacentHTML('beforeend','<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="tr">Try again</button></div>');$('#tr').onclick=()=>go(()=>playStage(7))}}}}
   if(t>=DUR&&!fin){fin=true;$('#hn').textContent='Oliver reached the inn!';setTimeout(()=>done(hearts>=3?3:hearts==2?2:1),700)}
   hud(Math.max(0,Math.ceil(DUR-t))+'s');$('#pg').style.width=Math.min(100,t/DUR*100)+'%';
   gr.setAttribute('transform',`translate(${-(t*sp*1)%70},0)`)}
  pl.innerHTML=(inv>0&&Math.floor(inv*10)%2?'':fig('oliver',160,372-y,1.25,{e:y>2?'shock':'scared',d:t%2}));
  ob.innerHTML=obs.map(o=>o.type=='fence'?`<g transform="translate(${o.x},372)"><path d="M0 0v-42M17 0v-42M34 0v-42" stroke="${C.woodd}" stroke-width="7"/><path d="M-4 -30h42M-4 -12h42" stroke="${C.wood}" stroke-width="6"/></g>`:o.type=='stone'?`<ellipse cx="${o.x+15}" cy="372" rx="17" ry="14" fill="#8a8478" stroke="#5e584c" stroke-width="2"/>`:`<ellipse cx="${o.x+35}" cy="378" rx="38" ry="7" fill="#6f95ad" stroke="#4a6a80" stroke-width="2"/>`).join('');
  raf=requestAnimationFrame(loop)};
 raf=requestAnimationFrame(loop);cleanup=()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',kd)};
};

function quiz(b,qs,done,hud,pre=''){
 let i=0,ok=0;
 const show=()=>{const q=qs[i];const opts=q.tf!=null?['True','False']:q.o;const ans=q.tf!=null?(q.a==1?0:1):q.a;
  b.innerHTML=`${pre}<div class="chap">Question ${i+1} of ${qs.length}</div><div class="q">${esc(q.q)}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="fb"></div>`;
  b.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{const k=+btn.dataset.k;b.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.querySelectorAll('.opt')[ans].classList.add('right');
   if(k==ans){ok++;sfx.ok();$('#fb').innerHTML=`<div class="fb ok">✔ Correct! ${esc(q.e)}</div>`}else{btn.classList.add('wrong');sfx.bad();$('#fb').innerHTML=`<div class="fb no">✘ Not this time. ${esc(q.e)}</div>`}
   hud(ok+' correct');$('#fb').insertAdjacentHTML('beforeend',`<div style="margin-top:12px"><button class="btn" id="nq">${i+1>=qs.length?'Finish ▶':'Next ▶'}</button></div>`);$('#nq').onclick=()=>{i++;if(i>=qs.length)done(ok>=qs.length?3:ok>=Math.ceil(qs.length*.6)?2:1);else show()}})};
 show();hud('0 correct');
}
GAMES.quiz=(b,st,done,hud)=>quiz(b,st.qs,done,hud,`<div style="margin-bottom:10px">${sceneSVG(st.scene,st.chars)}</div>`);
GAMES.final=(b,st,done,hud)=>quiz(b,st.qs,done,hud,'');

GAMES.scramble=(b,st,done,hud)=>{
 const W=[['DOCTOR','He helps sick people.'],['PRAYER','The old lady fell on her knees in ...'],['SLEEP','Rose fell into a deep ...'],['FLOWERS','Oliver picked beautiful ... for Rose\'s room.']];
 let wi=0,mist=0,pos=0;
 const show=()=>{const [w,h,ar]=W[wi];let tl=shuffle([...w].map((c,i)=>({c,i})));let g=0;while(tl.map(t=>t.c).join('')==w&&g++<20)tl=shuffle(tl);
  b.innerHTML=`<div>${sceneSVG('hall',[['losberne',300,404,1.2,{e:'happy'}],['maylie',460,404,1.2,{e:'happy'}]],{night:true})}</div><p class="q" style="text-align:center">${esc(h)}</p><div class="tilesrow" id="sl">${[...w].map(()=>`<div class="slot"></div>`).join('')}</div><div class="tilesrow" id="tl">${tl.map((t,k)=>`<button class="tile" data-k="${k}">${t.c}</button>`).join('')}</div><p class="hint" id="hn">Word ${wi+1} of ${W.length}</p>`;
  pos=0;const slots=[...b.querySelectorAll('.slot')];
  b.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{if(t.classList.contains('used'))return;if(t.textContent==w[pos]){slots[pos].textContent=t.textContent;t.classList.add('used');pos++;sfx.pop();if(pos>=w.length){sfx.ok();hud((wi+1)+' / '+W.length);setTimeout(()=>{wi++;if(wi>=W.length)done(starsBy(mist,2,5));else show()},700)}}else{mist++;sfx.bad();shake(t)}})};
 show();hud('0 / '+W.length);
};

GAMES.search=(b,st,done,hud)=>{
 const bush=[[110,330],[250,350],[380,340],[520,360],[650,335],[740,370],[170,395],[460,400],[600,405]];
 const ck=['hat','foot','button'],cn={hat:'Fagin\'s top hat',foot:'a footprint',button:'a brass button'};
 const spots=shuffle(bush.map((_,i)=>i)).slice(0,3),clue={};spots.forEach((s,i)=>clue[s]=ck[i]);
 let tries=8,got=new Set(),tapped=new Set(),fin=false;
 let ins=sceneInner('nightgarden')+bush.map((p,i)=>`<g id="b${i}" style="cursor:pointer" transform="translate(${p[0]},${p[1]})"><ellipse cx="0" cy="0" rx="46" ry="30" fill="#3d6048"/><ellipse cx="-22" cy="-10" rx="26" ry="20" fill="#4a7054"/><ellipse cx="24" cy="-8" rx="28" ry="22" fill="#44684e"/><g id="r${i}"></g></g>`).join('');
 b.innerHTML=`<div class="wrapA" id="wa">${sv(ins)}<div class="dark" id="dk"></div></div><div class="row" style="justify-content:space-between;margin-top:10px"><span class="hearts" id="tr">🏮 × ${tries}</span><div class="find" id="fd" style="margin:0">${ck.map(k=>`<span id="c_${k}">${cn[k]}</span>`).join('')}</div></div><p class="hint" id="hn">Tap a bush.</p>`;
 const wa=$('#wa'),dk=$('#dk');const mv=e=>{const r=wa.getBoundingClientRect(),p=e.touches?e.touches[0]:e;dk.style.setProperty('--x',(p.clientX-r.left)+'px');dk.style.setProperty('--y',(p.clientY-r.top)+'px')};
 wa.addEventListener('pointermove',mv);wa.addEventListener('pointerdown',mv);
 bush.forEach((p,i)=>$('#b'+i).addEventListener('click',()=>{if(fin||tapped.has(i))return;tapped.add(i);tries--;$('#tr').textContent='🏮 × '+tries;const c=clue[i];
  if(c){got.add(c);sfx.ok();$('#r'+i).innerHTML=`<g transform="translate(-24,-62) scale(1.05)">${ICON[c]}</g>`;$('#c_'+c).classList.add('ok');$('#hn').textContent='A clue! You found '+cn[c]+'!'}else{sfx.pop();$('#r'+i).innerHTML=`<text x="0" y="-36" text-anchor="middle" font-size="14" fill="#e8dcc0" font-family="Lora">nothing…</text>`;$('#hn').textContent='Just leaves and shadows…'}
  $('#b'+i).style.opacity=.75;hud(got.size+' / 3 clues');
  if(got.size>=3){fin=true;dk.style.opacity=.15;setTimeout(()=>done(tries>=4?3:tries>=2?2:1),900)}else if(tries<=0){fin=true;$('#hn').textContent='The lantern is out! Fagin has escaped… try again!';b.insertAdjacentHTML('beforeend','<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="tr2">Try again</button></div>');$('#tr2').onclick=()=>go(()=>playStage(10))}}));
 hud('0 / 3 clues');
};

/* ============================== start ============================== */
updHUD();
const sp=parseInt(P.get('stage'));
if(!isNaN(sp)&&STAGES[sp-1]){go(()=>P.get('play')?playStage(sp-1):showStage(sp-1))}else if(P.get('map'))go(showMap);else showTitle();
</script>
