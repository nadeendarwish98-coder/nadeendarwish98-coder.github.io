<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abbasid Quest · Grade 8 Social Studies Review</title>
<meta name="theme-color" content="#070b1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1f;--bg2:#111a3f;--gold:#f5c45e;--gold2:#ffe3a1;--teal:#3ad7c4;--red:#ff5d73;--ivory:#f7f1e1;--glass:rgba(255,255,255,.07);--line:rgba(245,196,94,.28)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:radial-gradient(1200px 700px at 50% -10%,#1b2a66 0%,var(--bg) 60%);color:var(--ivory);overflow-x:hidden;line-height:1.45}
h1,h2,h3,.cz{font-family:'Cinzel',Georgia,'Times New Roman',serif}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none;width:100%;height:100%}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}
.screen{animation:scrIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes scrIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:999px;font-weight:700;font-size:1rem;color:#2a1c00;background:linear-gradient(135deg,#ffe3a1,#f5c45e 55%,#e0a23a);box-shadow:0 6px 22px rgba(245,196,94,.35),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 30px rgba(245,196,94,.5)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass);color:var(--ivory);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:8px 16px;font-size:.85rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:1.05rem;display:grid;place-items:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{text-align:center}

/* ---------- INTRO ---------- */
.intro{min-height:calc(100vh - 54px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding-bottom:120px}
.intro .moon{position:absolute;top:2%;right:6%;width:84px;height:84px;filter:drop-shadow(0 0 22px rgba(255,227,161,.8));animation:float 6s ease-in-out infinite}
.eyebrow{letter-spacing:.35em;font-size:.72rem;color:var(--gold);text-transform:uppercase;font-weight:600;animation:fadeUp .9s .1s both}
.hero{font-size:clamp(2.6rem,10vw,4.6rem);line-height:1.02;margin:10px 0 6px;font-weight:800;background:linear-gradient(180deg,#fff7dc,#f5c45e 60%,#c4872a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px rgba(245,196,94,.45));animation:heroIn 1.2s cubic-bezier(.2,.9,.2,1) .2s both}
.sub{font-size:1.02rem;color:#d9d2bd;max-width:420px;margin:0 auto 22px;animation:fadeUp .9s .6s both}
.intro .btn{animation:fadeUp .9s 1s both,glow 2.4s 2s ease-in-out infinite}
.skyline{position:fixed;left:0;right:0;bottom:0;height:230px;filter:drop-shadow(0 0 18px rgba(245,196,94,.25));z-index:0;pointer-events:none}
.skyline svg{width:100%;height:100%}
.win{animation:twinkle 3s ease-in-out infinite}
@keyframes heroIn{from{opacity:0;transform:scale(.7) translateY(30px);letter-spacing:.4em}to{opacity:1;transform:none;letter-spacing:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{box-shadow:0 6px 22px rgba(245,196,94,.35)}50%{box-shadow:0 6px 44px rgba(245,196,94,.85)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- MAP ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:.88rem}
.maptitle{font-size:1.5rem;margin:6px 0 2px;color:var(--gold2)}
.mapsub{font-size:.85rem;color:#c9c2ad;margin-bottom:10px}
.trail{position:relative;padding:10px 0 20px}
.trail:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:0;border-left:3px dashed rgba(245,196,94,.4);transform:translateX(-50%);animation:trailflow 1.6s linear infinite}
@keyframes trailflow{to{border-left-color:rgba(245,196,94,.9)}}
.node{position:relative;z-index:1;display:flex;margin:14px 0;animation:nodeIn .6s both;animation-delay:calc(var(--i)*.09s)}
.node:nth-child(odd){justify-content:flex-start}
.node:nth-child(even){justify-content:flex-end}
@keyframes nodeIn{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
.stage{width:min(78%,420px);display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.04)),#0e1740;border:1px solid var(--line);transition:transform .2s,border-color .2s;position:relative}
.stage:hover{transform:translateY(-3px) scale(1.02);border-color:var(--gold)}
.stage .ic{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:radial-gradient(circle at 30% 25%,#fff3,transparent 60%),var(--c);box-shadow:0 0 22px var(--c)}
.stage .tx b{display:block;font-family:'Cinzel',serif;font-size:1rem;line-height:1.15}
.stage .tx small{color:#cfc8b3;font-size:.78rem;line-height:1.2;display:block;margin-top:3px}
.stars{letter-spacing:2px;font-size:.85rem;margin-top:3px;filter:grayscale(1) opacity(.35)}
.stars.on{filter:none}
.stage.locked{opacity:.5;filter:grayscale(.7);pointer-events:none}
.stage.locked .ic:after{content:"🔒";position:absolute;right:10px;top:8px;font-size:1rem}
.stage.boss{border-color:var(--red);background:linear-gradient(135deg,rgba(255,93,115,.25),rgba(255,255,255,.04)),#1a1030;animation:bossPulse 2s ease-in-out infinite}
@keyframes bossPulse{0%,100%{box-shadow:0 0 0 rgba(255,93,115,0)}50%{box-shadow:0 0 34px rgba(255,93,115,.55)}}
.nextflag{position:absolute;top:-8px;right:-6px;background:var(--teal);color:#032a26;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:999px;animation:bounce 1.2s infinite}
@keyframes bounce{50%{transform:translateY(-4px)}}

/* ---------- STORY ---------- */
.topline{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prog{flex:1;height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px var(--gold)}
.chip{display:inline-block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(245,196,94,.08)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:24px;padding:16px;backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.scene{position:relative;height:230px;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(245,196,94,.16),rgba(0,0,0,.25) 70%),linear-gradient(180deg,#0e1a45,#0a1130);border:1px solid rgba(245,196,94,.2);margin-bottom:14px}
.scene svg.svg{position:absolute;inset:0;width:100%;height:100%}
.scene .big{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:'Cinzel',serif;font-weight:800;font-size:clamp(1.8rem,8vw,2.8rem);color:var(--gold2);text-shadow:0 0 24px rgba(245,196,94,.9),0 3px 0 #7a4f10;animation:bigIn .9s .15s cubic-bezier(.2,1.4,.3,1) both;z-index:3}
@keyframes bigIn{from{opacity:0;transform:scale(2.4);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.stitle{font-size:1.45rem;margin-bottom:8px;color:#fff;animation:fadeUp .6s .1s both}
.pts{list-style:none;display:grid;gap:9px}
.pts li{position:relative;padding:10px 12px 10px 38px;background:rgba(255,255,255,.06);border-radius:14px;font-size:.95rem;animation:ptIn .6s both;animation-delay:calc(.25s + var(--i)*.28s);border-left:3px solid var(--gold)}
.pts li:before{content:"✦";position:absolute;left:12px;top:9px;color:var(--gold)}
@keyframes ptIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s}
.dots i.on{background:var(--gold);transform:scale(1.35);box-shadow:0 0 10px var(--gold)}

/* scene parts */
.tiles{position:absolute;inset:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:14px;align-content:center}
.tiles.hasbig{padding-top:58px}
.tile{width:calc(33% - 10px);min-width:92px;max-width:130px;text-align:center;padding:10px 6px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);animation:pop .6s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*.22s + .25s)}
.tile .e{font-size:2rem;display:block;animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}
.tile .t{font-size:.72rem;font-weight:600;line-height:1.15;display:block;margin-top:3px}
.tile.top{width:100%;max-width:170px;background:rgba(245,196,94,.18);border-color:var(--gold);box-shadow:0 0 28px rgba(245,196,94,.4)}
.tile.top .e{font-size:2.4rem}
.tiles.pyr{flex-direction:column;gap:8px}
.tiles.pyr .rowt{display:flex;gap:8px;justify-content:center;width:100%}
.tiles.pyr .tile{min-width:70px;padding:7px 4px}
.tiles.pyr .tile .e{font-size:1.5rem}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.conv{position:absolute;inset:0}
.conv .c{position:absolute;left:50%;top:44%;font-size:3.4rem;transform:translate(-50%,-50%);filter:drop-shadow(0 0 18px #f5c45e);animation:breathe 2.4s ease-in-out infinite}
.conv .s{position:absolute;left:50%;top:44%;font-size:1.8rem;opacity:0;animation:fly 3.2s ease-in infinite;animation-delay:calc(var(--i)*.4s)}
.conv .lbl{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-weight:700;letter-spacing:.2em;font-size:.8rem;color:var(--gold2);text-transform:uppercase}
@keyframes fly{0%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2) rotate(0)}20%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(360deg)}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.14)}}
.tl{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 18px}
.tl .ln{position:absolute;left:8%;right:8%;top:6px;height:3px;background:linear-gradient(90deg,var(--teal),var(--gold));transform-origin:left;animation:grow 1.4s .2s both;border-radius:3px;box-shadow:0 0 12px var(--gold)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tl .it{display:flex;justify-content:space-between;position:relative;padding-top:0}
.tl .p{flex:1;text-align:center;animation:fadeUp .6s both;animation-delay:calc(var(--i)*.35s + .5s)}
.tl .p b{display:block;font-family:'Cinzel',serif;color:var(--gold2);font-size:1.1rem;margin-top:8px;text-shadow:0 0 12px rgba(245,196,94,.8)}
.tl .p span{display:block;font-size:.72rem;font-weight:600;margin-top:2px;padding:0 3px;line-height:1.2}
.tl .p:before{content:"";display:block;width:15px;height:15px;border-radius:50%;background:var(--gold);margin:0 auto;box-shadow:0 0 14px var(--gold);position:relative;z-index:2}
.orb{position:absolute;inset:0}
.orb .ctr{position:absolute;left:50%;top:50%;font-size:2.8rem;transform:translate(-50%,-50%);filter:drop-shadow(0 0 18px #f5c45e);animation:breathe 3s ease-in-out infinite}
.orb .ring{position:absolute;left:50%;top:50%;width:0;height:0;animation:rot 24s linear infinite}
.orb .sat{position:absolute;left:0;top:0;transform:rotate(var(--a)) translateX(88px) rotate(calc(-1*var(--a)))}
.orb .sat div{transform:translate(-50%,-50%);white-space:nowrap;padding:5px 11px;border-radius:99px;background:rgba(10,17,48,.85);border:1px solid var(--gold);font-size:.72rem;font-weight:600;animation:rotr 24s linear infinite;box-shadow:0 0 14px rgba(245,196,94,.4)}
.orb .guide{position:absolute;left:50%;top:50%;width:176px;height:176px;margin:-88px 0 0 -88px;border:1px dashed rgba(245,196,94,.4);border-radius:50%}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes rotr{to{transform:translate(-50%,-50%) rotate(-360deg)}}
.rl{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite,fadeIn .8s both}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.nd{transform-box:fill-box;transform-origin:center;animation:pop .6s both}
.nd text.l{font-size:11.5px;font-weight:600;fill:#fff;paint-order:stroke;stroke:#0a1130;stroke-width:3px;text-anchor:middle;font-family:'Poppins',sans-serif}
.nd text.em{font-size:20px;text-anchor:middle;dominant-baseline:central}
.ping{fill:none;stroke:var(--gold);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(.5)}to{opacity:0;transform:scale(2.4)}}
.horse{position:absolute;top:92px;font-size:2rem;animation:charge 3s ease-in-out infinite;z-index:2}
.horse.l{left:6%}
.horse.r{right:6%;transform:scaleX(-1)}
@keyframes charge{0%{transform:translateX(0)}60%,100%{transform:translateX(calc(var(--d)*80px))}}
.horse.r{animation-name:charge2}
@keyframes charge2{0%{transform:scaleX(-1) translateX(0)}60%,100%{transform:scaleX(-1) translateX(80px)}}
.spark{position:absolute;left:50%;top:84px;font-size:3rem;transform:translateX(-50%);animation:clang 1.5s ease-in-out infinite;z-index:2;filter:drop-shadow(0 0 16px #ffd36a)}
@keyframes clang{0%,55%{transform:translateX(-50%) scale(.4);opacity:0}70%{transform:translateX(-50%) scale(1.3) rotate(-10deg);opacity:1}100%{transform:translateX(-50%) scale(1) rotate(8deg);opacity:.9}}
.brick{transform-box:fill-box;transform-origin:center}
.fallb{animation:fallb 4s ease-in infinite}
@keyframes fallb{0%,30%{transform:none;opacity:1}58%{transform:translate(var(--fx),70px) rotate(var(--fr));opacity:.9}70%,96%{opacity:0}100%{transform:none;opacity:1}}
.weak{animation:weakp 1s ease-in-out infinite}
@keyframes weakp{50%{fill:#ff6a6a}}

/* ---------- QUIZ ---------- */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.xpb{font-weight:700;color:var(--gold2);font-size:.9rem;white-space:nowrap}
.streak{font-weight:700;color:#ffb24a;font-size:.85rem;min-width:56px;text-align:right}
.qcard{animation:qIn .5s cubic-bezier(.2,.9,.2,1) both}
@keyframes qIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.imp{background:linear-gradient(135deg,#ffe3a1,#f5c45e);color:#3a2500;font-size:.68rem;font-weight:800;letter-spacing:.12em;padding:4px 10px;border-radius:99px;animation:glow 2s infinite}
.qtext{font-size:1.18rem;font-weight:600;line-height:1.35;margin-bottom:14px;font-family:'Poppins',sans-serif}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);font-size:1rem;font-weight:500;transition:transform .15s,background .2s,border-color .2s}
.opt:hover{transform:translateX(4px);border-color:var(--gold);background:rgba(245,196,94,.1)}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(245,196,94,.18);color:var(--gold2);font-size:.85rem}
.opt.ok{background:rgba(58,215,196,.22);border-color:var(--teal);animation:okp .5s}
.opt.bad{background:rgba(255,93,115,.2);border-color:var(--red);animation:shake .45s}
.opt.dim{opacity:.45}
@keyframes okp{50%{transform:scale(1.04)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-size:1.15rem;font-weight:700;padding:22px 10px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.mt button{padding:12px 10px;border-radius:14px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);font-size:.88rem;font-weight:600;min-height:52px;transition:.15s}
.mt button.sel{border-color:var(--gold);background:rgba(245,196,94,.22);transform:scale(1.04);box-shadow:0 0 18px rgba(245,196,94,.5)}
.mt button.done{background:rgba(58,215,196,.22);border-color:var(--teal);pointer-events:none}
.mt button.shk{animation:shake .4s;border-color:var(--red)}
.hint{font-size:.78rem;color:#c9c2ad;margin-bottom:10px}
.slots{display:grid;gap:8px;margin-bottom:12px}
.slot{min-height:46px;border-radius:14px;border:1.5px dashed rgba(245,196,94,.4);display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:.9rem;font-weight:600}
.slot b{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(245,196,94,.2);display:grid;place-items:center;font-size:.8rem;color:var(--gold2)}
.slot.f{border-style:solid;border-color:var(--teal);background:rgba(58,215,196,.15);animation:pop .4s}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bank button{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);font-weight:600;font-size:.88rem;transition:.15s}
.bank button:hover{border-color:var(--gold)}
.bank button.used{display:none}
.bank button.shk{animation:shake .4s;border-color:var(--red)}
.cloze{font-size:1.02rem;line-height:2.3;margin-bottom:14px}
.blank{display:inline-block;min-width:90px;padding:2px 12px;margin:0 3px;border-bottom:3px solid var(--gold);background:rgba(245,196,94,.12);border-radius:8px 8px 0 0;font-weight:700;color:var(--gold2);text-align:center;line-height:1.7}
.blank.act{background:rgba(245,196,94,.3);animation:glow 1.5s infinite}
.blank.ok{border-color:var(--teal);color:#8ff3e5;background:rgba(58,215,196,.18)}
.blank.bad{border-color:var(--red);color:#ffb3bd;background:rgba(255,93,115,.18)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px 16px 22px;border-radius:26px 26px 0 0;animation:sheetUp .45s cubic-bezier(.2,1,.3,1) both;box-shadow:0 -14px 50px rgba(0,0,0,.55)}
.sheet.ok{background:linear-gradient(180deg,#0f4a45,#0a2f30)}
.sheet.bad{background:linear-gradient(180deg,#5a1626,#34101c)}
.sheet .in{max-width:760px;margin:0 auto}
.sheet h3{font-size:1.2rem;margin-bottom:4px;font-family:'Poppins',sans-serif;font-weight:700}
.sheet p{font-size:.92rem;margin-bottom:12px;color:#f1ebd8}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.xpfloat{position:fixed;left:50%;top:38%;font-weight:800;font-size:2rem;color:var(--gold2);text-shadow:0 0 20px var(--gold);z-index:70;pointer-events:none;animation:xpup 1.1s ease-out forwards}
@keyframes xpup{from{opacity:1;transform:translate(-50%,0) scale(.7)}to{opacity:0;transform:translate(-50%,-90px) scale(1.4)}}
.hearts{font-size:1.15rem;letter-spacing:2px}
.bosshp{flex:1}
.bosshp .lab{font-size:.68rem;letter-spacing:.14em;color:#ffb3bd;font-weight:700;display:flex;justify-content:space-between;margin-bottom:3px}
.bosshp .bar{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid rgba(255,93,115,.5)}
.bosshp .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff5d73,#ffb24a);transition:width .6s;box-shadow:0 0 14px #ff5d73}
.bossface{font-size:1.9rem;transition:.2s}
.bossface.hit{animation:shake .5s}

/* ---------- RESULT / CERT ---------- */
.res{text-align:center;padding-top:14px}
.res .big3{font-size:3.2rem;letter-spacing:6px;margin:6px 0}
.res .big3 span{display:inline-block;animation:starIn .8s cubic-bezier(.2,1.6,.3,1) both;animation-delay:calc(var(--i)*.4s + .2s)}
.res .big3 span.off{filter:grayscale(1) opacity(.25)}
@keyframes starIn{from{opacity:0;transform:scale(4) rotate(-90deg)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 6px}
.stat b{display:block;font-size:1.4rem;color:var(--gold2)}
.stat small{font-size:.72rem;color:#cfc8b3}
.cert{border:3px double var(--gold);border-radius:18px;padding:26px 16px;background:radial-gradient(circle at 50% 0,rgba(245,196,94,.25),rgba(255,255,255,.04) 70%);margin:14px 0;position:relative;animation:pop .8s both}
.cert h2{font-size:1.5rem;color:var(--gold2);letter-spacing:.06em}
.cert .nm{font-family:'Cinzel',serif;font-size:1.7rem;margin:10px 0;color:#fff;border-bottom:2px solid var(--gold);display:inline-block;min-width:200px;padding:0 10px}
.cert input{background:transparent;border:0;border-bottom:2px solid var(--gold);color:#fff;font-family:'Cinzel',serif;font-size:1.5rem;text-align:center;width:min(100%,320px);outline:none;padding:4px}
.cert .seal{font-size:3rem;margin-top:6px;animation:float 3s ease-in-out infinite}

/* ---------- FLASHCARDS ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tabs button{flex:none;padding:8px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:.8rem;font-weight:600}
.tabs button.on{background:linear-gradient(135deg,#ffe3a1,#f5c45e);color:#2a1c00}
.fc{perspective:1200px;height:270px;margin:8px 0 14px}
.fc .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1.5px solid var(--gold);background:linear-gradient(160deg,#1a2a63,#0d1538);box-shadow:0 16px 40px rgba(0,0,0,.45),inset 0 0 40px rgba(245,196,94,.08)}
.fc .face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#5a3d0a,#2c1d05)}
.fc .face small{letter-spacing:.2em;font-size:.68rem;color:var(--gold);margin-bottom:12px;font-weight:700}
.fc .face p{font-size:1.15rem;font-weight:600}

/* ---------- BOSS INTRO ---------- */
.bossintro{text-align:center;padding-top:10px}
.bossintro .guard{font-size:6rem;animation:float 3s ease-in-out infinite,bossGlow 2s infinite;display:block;margin:8px 0}
@keyframes bossGlow{50%{filter:drop-shadow(0 0 34px #ff5d73)}}
.rules{list-style:none;display:grid;gap:8px;text-align:left;max-width:420px;margin:14px auto}
.rules li{background:var(--glass);padding:10px 14px;border-radius:14px;border:1px solid var(--line);font-size:.92rem}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:5%;top:10%;width:90%}#bg,#fx,.skyline{display:none}}
</style>

<script>
"use strict";
/* =====================================================================
   ABBASID QUEST — Grade 8 Social Studies (Flexi) revision game
   Everything is in this one file. Content lives in LESSONS below.
   ===================================================================== */

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const UNLOCK_ALL=location.hash.indexOf('unlock')>-1;

/* ---------- saved progress ---------- */
const KEY='abbasidQuestG8v1';
let state=(function(){try{return Object.assign({stars:{},xp:0,boss:false,name:''},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {stars:{},xp:0,boss:false,name:''}}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

/* ---------- sound ---------- */
let AC=null,muted=false;
function beep(f,d,type,v,when){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+(when||0);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={tap:()=>beep(520,.05,'sine',.04),ok:()=>{beep(660,.12,'triangle',.07);beep(990,.18,'triangle',.07,.1)},bad:()=>{beep(200,.28,'sawtooth',.05)},win:()=>[523,659,784,1046,1318].forEach((f,i)=>beep(f,.25,'triangle',.07,i*.12))};

/* ---------- animated night sky ---------- */
(function(){
  const c=$('#bg'),x=c.getContext('2d');let W,H,stars=[],dust=[],shoot=null;
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;stars=Array.from({length:Math.round(W*H/7000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,p:Math.random()*6.28,s:Math.random()*.02+.005}));dust=Array.from({length:26},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+1,v:Math.random()*.3+.1,p:Math.random()*6.28}))}
  addEventListener('resize',size);size();
  function tick(){
    x.clearRect(0,0,W,H);
    stars.forEach(s=>{s.p+=s.s;x.globalAlpha=.35+.65*Math.abs(Math.sin(s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()});
    dust.forEach(d=>{d.y-=d.v;d.p+=.02;d.x+=Math.sin(d.p)*.3;if(d.y<-10){d.y=H+10;d.x=Math.random()*W}x.globalAlpha=.35;x.fillStyle='#f5c45e';x.shadowColor='#f5c45e';x.shadowBlur=10;x.beginPath();x.arc(d.x,d.y,d.r,0,6.28);x.fill();x.shadowBlur=0});
    if(!shoot&&Math.random()<.004)shoot={x:Math.random()*W*.8,y:Math.random()*H*.4,l:0};
    if(shoot){shoot.x+=9;shoot.y+=4;shoot.l+=1;x.globalAlpha=1-shoot.l/40;x.strokeStyle='#ffe3a1';x.lineWidth=2;x.beginPath();x.moveTo(shoot.x,shoot.y);x.lineTo(shoot.x-60,shoot.y-26);x.stroke();if(shoot.l>40)shoot=null}
    x.globalAlpha=1;requestAnimationFrame(tick)
  }
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)tick();
})();

/* ---------- confetti ---------- */
function confetti(n){
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#f5c45e','#ffe3a1','#3ad7c4','#ff5d73','#ffffff','#8fb7ff'];
  const P=Array.from({length:n||160},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,w:Math.random()*9+4,h:Math.random()*5+3,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(++f<170)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})();
}
function xpPop(txt){const d=document.createElement('div');d.className='xpfloat';d.textContent=txt;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}

/* =====================================================================
   SCENES — animated motion graphics for every story card
   ===================================================================== */
const SC={};
SC.astrolabe=o=>{
  let t='';for(let i=0;i<48;i++){const a=i*7.5*Math.PI/180,r1=92,r2=i%4?99:106;t+=`<line x1="${200+r1*Math.cos(a)}" y1="${125+r1*Math.sin(a)}" x2="${200+r2*Math.cos(a)}" y2="${125+r2*Math.sin(a)}"/>`}
  return `<svg class="svg" viewBox="0 0 400 230"><defs><radialGradient id="ag"><stop offset="0" stop-color="#ffe7a0" stop-opacity=".85"/><stop offset="1" stop-color="#f5c45e" stop-opacity="0"/></radialGradient></defs>
  <circle cx="200" cy="125" r="108" fill="url(#ag)" opacity=".5"><animate attributeName="r" values="100;118;100" dur="4s" repeatCount="indefinite"/></circle>
  <g stroke="#f5c45e" fill="none" stroke-width="1.6"><g stroke-width="1.3">${t}<animateTransform attributeName="transform" type="rotate" from="0 200 125" to="360 200 125" dur="50s" repeatCount="indefinite"/></g>
  <circle cx="200" cy="125" r="80" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="360 200 125" to="0 200 125" dur="30s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="125" r="58" stroke-dasharray="14 6"><animateTransform attributeName="transform" type="rotate" from="0 200 125" to="360 200 125" dur="20s" repeatCount="indefinite"/></circle>
  <path d="M200 45 L206 125 L200 205 L194 125Z" fill="rgba(245,196,94,.25)"><animateTransform attributeName="transform" type="rotate" from="0 200 125" to="360 200 125" dur="14s" repeatCount="indefinite"/></path></g>
  <text x="200" y="136" font-size="44" text-anchor="middle">${o.emoji||'☀️'}</text></svg>`;
};
SC.converge=o=>{
  const sc=['-150px,-50px','150px,-60px','-130px,80px','140px,70px','0px,-100px','-60px,100px','90px,-90px','-170px,10px'];
  return `<div class="conv"><div class="c">${o.center||'🏛️'}</div>${sc.map((p,i)=>{const [x,y]=p.split(',');return `<div class="s" style="--x:${x};--y:${y};--i:${i}">📜</div>`}).join('')}<div class="lbl">${esc(o.label||'')}</div></div>`;
};
SC.icons=o=>{
  const tl=t=>`<div class="tile" style="--i:${t.i}"><span class="e">${t.e}</span><span class="t">${esc(t.t)}</span></div>`;
  let i=0;const tiles=o.tiles.map(t=>({...t,i:i++}));
  if(o.top){return `<div class="tiles pyr ${o.hasbig?'hasbig':''}"><div class="tile top" style="--i:0"><span class="e">${o.top.e}</span><span class="t">${esc(o.top.t)}</span></div><div class="rowt">${tiles.map(t=>tl({...t,i:t.i+1})).join('')}</div></div>`}
  return `<div class="tiles ${o.hasbig?'hasbig':''}">${tiles.map(tl).join('')}</div>`;
};
SC.timeline=o=>`<div class="tl"><div class="it"><div class="ln" style="left:${50/o.items.length}%;right:${50/o.items.length}%"></div>${o.items.map((p,i)=>`<div class="p" style="--i:${i}"><b>${esc(p.k)}</b><span>${esc(p.t)}</span></div>`).join('')}</div></div>`;
SC.orbit=o=>{
  const n=o.items.length;
  return `<div class="orb"><div class="guide"></div><div class="ctr">${o.center||'⭐'}</div><div class="ring">${o.items.map((it,i)=>`<div class="sat" style="--a:${Math.round(360/n*i-90)}deg"><div>${it.e} ${esc(it.t)}</div></div>`).join('')}</div></div>`;
};
SC.route=o=>{
  const N=o.nodes,C=o.center;let lines='',nodes='',k=0;
  const seg=(a,b,i)=>{const d=`M${a.x} ${a.y} Q${(a.x+b.x)/2} ${Math.min(a.y,b.y)-34} ${b.x} ${b.y}`;return `<path class="rl" d="${d}" style="animation-delay:0s,${i*.45}s"/><circle r="3.6" fill="#fff"><animateMotion dur="2.6s" begin="${i*.45}s" repeatCount="indefinite" path="${d}"/></circle>`};
  if(o.chain){for(let i=0;i<N.length-1;i++)lines+=seg(N[i],N[i+1],i)}else if(C){N.forEach((n,i)=>lines+=seg(C,n,i))}
  const all=(C?[C]:[]).concat(N).concat(o.extras||[]);
  all.forEach((n,i)=>{nodes+=`<g class="nd" style="animation-delay:${i*.35}s"><circle class="ping" cx="${n.x}" cy="${n.y}" r="12"/><text class="em" x="${n.x}" y="${n.y}">${n.e||'📍'}</text><text class="l" x="${n.x}" y="${n.y+(n.up?-20:22)}">${esc(n.l||'')}</text></g>`});
  let grid='';for(let x=20;x<400;x+=24)for(let y=30;y<230;y+=24)grid+=`<circle cx="${x}" cy="${y}" r=".9"/>`;
  return `<svg class="svg" viewBox="0 0 400 230"><g fill="rgba(245,196,94,.18)">${grid}</g>${lines}${nodes}${o.note===false?'':'<text x="200" y="224" font-size="8.5" fill="rgba(255,255,255,.4)" text-anchor="middle">Schematic map — not to scale</text>'}</svg>`;
};
SC.clash=()=>{
  const fl=(x,c,s)=>`<line x1="${x}" y1="70" x2="${x}" y2="170" stroke="#d7c79a" stroke-width="3"/><path fill="${c}" stroke="${s}" d="M${x} 72 q18 -8 36 0 t36 0 v34 q-18 8 -36 0 t-36 0z"><animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M${x} 72 q18 -8 36 0 t36 0 v34 q-18 8 -36 0 t-36 0z;M${x} 72 q18 8 36 0 t36 0 v34 q-18 -8 -36 0 t-36 0z;M${x} 72 q18 -8 36 0 t36 0 v34 q-18 8 -36 0 t-36 0z"/></path>`;
  return `<svg class="svg" viewBox="0 0 400 230">${fl(40,'#0c0c12','#f5c45e')}${fl(290,'#f2ead2','#9a8a5a')}
  <g fill="rgba(58,160,215,.55)"><path d="M0 190 q25 -14 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V230 H0z"><animateTransform attributeName="transform" type="translate" values="0 0;-50 0" dur="3s" repeatCount="indefinite"/></path></g>
  <g fill="rgba(120,200,255,.5)"><path d="M0 204 q25 -12 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V230 H0z"><animateTransform attributeName="transform" type="translate" values="-50 0;0 0" dur="2.4s" repeatCount="indefinite"/></path></g>
  <text x="200" y="224" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">TIGRIS RIVER</text>
  <text x="76" y="190" font-size="11" fill="#ffe3a1" text-anchor="middle" font-weight="700">ABBASIDS</text><text x="326" y="190" font-size="11" fill="#ffe3a1" text-anchor="middle" font-weight="700">UMAYYADS</text></svg>
  <div class="horse l" style="--d:1">🐎</div><div class="horse r">🐎</div><div class="spark">⚔️</div>`;
};
SC.roundcity=()=>{
  let gates='';[[200,35],[285,125],[200,215],[115,125]].forEach((g,i)=>gates+=`<rect x="${g[0]-6}" y="${g[1]-6}" width="12" height="12" rx="2" fill="#ffe3a1"><animate attributeName="opacity" values=".4;1;.4" dur="2s" begin="${i*.4}s" repeatCount="indefinite"/></rect>`);
  return `<svg class="svg" viewBox="0 0 400 230"><defs><radialGradient id="rg"><stop offset="0" stop-color="#ffe7a0" stop-opacity=".7"/><stop offset="1" stop-color="#f5c45e" stop-opacity="0"/></radialGradient></defs>
  <circle cx="200" cy="125" r="100" fill="url(#rg)" opacity=".45"/>
  <circle cx="200" cy="125" r="92" fill="none" stroke="#f5c45e" stroke-width="2.5" stroke-dasharray="580" stroke-dashoffset="580"><animate attributeName="stroke-dashoffset" from="580" to="0" dur="2.2s" begin=".2s" fill="freeze"/></circle>
  <circle cx="200" cy="125" r="62" fill="none" stroke="rgba(245,196,94,.55)" stroke-width="1.5" stroke-dasharray="4 6"><animateTransform attributeName="transform" type="rotate" from="0 200 125" to="360 200 125" dur="16s" repeatCount="indefinite"/></circle>
  <g stroke="rgba(245,196,94,.35)" stroke-width="1"><line x1="200" y1="35" x2="200" y2="215"/><line x1="110" y1="125" x2="290" y2="125"/></g>${gates}
  <text x="200" y="138" font-size="36" text-anchor="middle">🕌</text></svg>`;

SC.siege=()=>{
  let b='';const fx=[-30,25,-15,40,-35,20,-10,30],fr=['-40deg','50deg','-25deg','70deg','-60deg','35deg','-15deg','55deg'];let n=0;
  for(let c=0;c<4;c++)for(let r=0;r<6;r++){const x=250+c*28,y=60+r*22,weak=(c==1||c==2)&&r>=2&&r<=4;b+=`<rect class="brick ${weak?'weak fallb':''}" x="${x}" y="${y}" width="26" height="20" rx="2" fill="${weak?'#8a6a45':'#b99a6a'}" stroke="#5c4524" ${weak?`style="--fx:${fx[n%8]}px;--fr:${fr[n++%8]}"`:''}/>`}
  return `<svg class="svg" viewBox="0 0 400 230"><rect y="192" width="400" height="40" fill="#2a2113"/>${b}
  <text x="305" y="50" font-size="11" fill="#ffe3a1" text-anchor="middle" font-weight="700">AMORIUM</text>
  <g><path d="M30 190 L62 190 L52 168 L38 168Z" fill="#7b5a2e"/><rect x="40" y="160" width="26" height="6" rx="2" fill="#a67c3d" transform="rotate(-28 53 163)"/><circle cx="60" cy="160" r="9" fill="#8a8a8a"/><circle cx="60" cy="160" r="3" fill="#444"/></g>
  <text x="46" y="210" font-size="10" fill="#ffe3a1" text-anchor="middle" font-weight="600">BALLISTA</text>
  <circle r="6" fill="#d0d0d0" stroke="#666"><animateMotion dur="4s" repeatCount="indefinite" keyTimes="0;.3;1" keyPoints="0;1;1" calcMode="linear" path="M62 156 Q160 40 262 122"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.3;.31;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="262" cy="122" r="0" fill="#ffd36a"><animate attributeName="r" values="0;0;26;0" keyTimes="0;.3;.38;.5" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;.9;0" keyTimes="0;.3;.38;.5" dur="4s" repeatCount="indefinite"/></circle></svg>`;
};

/* =====================================================================

const LESSONS=[

/* =====================================================================
   QUIZ ENGINE
   ===================================================================== */
const R={};
R.mcq=(q,el,done)=>{
  const o=shuffle(q.opts.map((t,i)=>({t,c:i===q.a})));let lock=false;
  el.innerHTML=`<div class="opts">${o.map((x,i)=>`<button class="opt" data-i="${i}"><b>${'ABCD'[i]}</b><span>${esc(x.t)}</span></button>`).join('')}</div>`;
  const bs=el.querySelectorAll('.opt');
  bs.forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const x=o[+b.dataset.i];b.classList.add(x.c?'ok':'bad');bs.forEach((bb,i)=>{if(o[i].c)bb.classList.add('ok');else if(bb!==b)bb.classList.add('dim')});done(x.c)});
};
R.tf=(q,el,done)=>{
  let lock=false;
  el.innerHTML=`<div class="tf"><button class="opt" data-v="1">✔ True</button><button class="opt" data-v="0">✘ False</button></div>`;
  const bs=el.querySelectorAll('.opt');
  bs.forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const v=b.dataset.v==='1',ok=v===q.a;b.classList.add(ok?'ok':'bad');if(!ok)bs.forEach(bb=>{if((bb.dataset.v==='1')===q.a)bb.classList.add('ok')});done(ok)});
};
R.match=(q,el,done)=>{
  const L=q.pairs.map((p,i)=>({t:p[0],i})),Rr=shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
  let sel=null,miss=0,got=0;
  el.innerHTML=`<p class="hint">Tap an item on the left, then its match on the right.</p><div class="mt"><div style="display:grid;gap:10px" id="ml">${L.map(x=>`<button data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div><div style="display:grid;gap:10px" id="mr">${Rr.map(x=>`<button data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
  const lb=[...el.querySelectorAll('#ml button')],rb=[...el.querySelectorAll('#mr button')];
  lb.forEach(b=>b.onclick=()=>{sfx.tap();lb.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b});
  rb.forEach(b=>b.onclick=()=>{
    if(!sel)return;
    if(sel.dataset.i===b.dataset.i){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;got++;sfx.ok();if(got===q.pairs.length)done(miss===0)}
    else{miss++;sfx.bad();[sel,b].forEach(x=>{x.classList.add('shk');setTimeout(()=>x.classList.remove('shk'),450)});sel.classList.remove('sel');sel=null}
  });
};
R.order=(q,el,done)=>{
  const items=shuffle(q.items.map((t,i)=>({t,i})));let nxt=0,miss=0;
  el.innerHTML=`<p class="hint">Tap the events in the order they happened.</p><div class="slots">${q.items.map((_,i)=>`<div class="slot" data-s="${i}"><b>${i+1}</b><span></span></div>`).join('')}</div><div class="bank">${items.map(x=>`<button data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>`;
  const slots=el.querySelectorAll('.slot');
  el.querySelectorAll('.bank button').forEach(b=>b.onclick=()=>{
    if(+b.dataset.i===nxt){const s=slots[nxt];s.classList.add('f');s.querySelector('span').textContent=b.textContent;b.classList.add('used');nxt++;sfx.ok();if(nxt===q.items.length)done(miss===0)}
    else{miss++;sfx.bad();b.classList.add('shk');setTimeout(()=>b.classList.remove('shk'),450)}
  });
};
R.fill=(q,el,done)=>{
  const parts=q.text.split(/\{(\d+)\}/);const vals=q.blanks.map(()=>null);let act=0;
  const bank=shuffle(q.blanks.concat(q.bank||[]).map((t,i)=>({t,i})));
  let html='';parts.forEach((p,i)=>{html+=i%2?`<span class="blank" data-b="${p}">&nbsp;&nbsp;&nbsp;</span>`:esc(p)});
  el.innerHTML=`<p class="hint">Tap a word to drop it into the highlighted blank. Tap a filled blank to clear it.</p><div class="cloze">${html}</div><div class="bank">${bank.map(x=>`<button data-i="${x.i}" data-t="${esc(x.t)}">${esc(x.t)}</button>`).join('')}</div><div style="margin-top:16px"><button class="btn" id="chk" disabled>Check ✔</button></div>`;
  const bl=[...el.querySelectorAll('.blank')],bb=[...el.querySelectorAll('.bank button')];
  function paint(){bl.forEach((b,i)=>{b.classList.toggle('act',i===act&&vals[i]===null);b.textContent=vals[i]===null?'   ':vals[i].t});$('#chk').disabled=vals.some(v=>v===null)}
  function nextEmpty(){const i=vals.findIndex(v=>v===null);act=i<0?0:i}
  paint();
  bb.forEach(b=>b.onclick=()=>{if(vals.every(v=>v!==null))return;sfx.tap();const i=vals[act]===null?act:vals.findIndex(v=>v===null);vals[i]={t:b.dataset.t,b};b.classList.add('used');nextEmpty();paint()});
  bl.forEach((b,i)=>b.onclick=()=>{if(vals[i]){vals[i].b.classList.remove('used');vals[i]=null;act=i;paint()}else{act=i;paint()}});
  $('#chk').onclick=()=>{let all=true;bl.forEach((b,i)=>{const ok=vals[i].t===q.blanks[i];b.classList.remove('act');b.classList.add(ok?'ok':'bad');if(!ok){all=false;b.textContent=vals[i].t+' → '+q.blanks[i]}});bb.forEach(b=>b.style.pointerEvents='none');$('#chk').style.display='none';all?sfx.ok():sfx.bad();done(all)};
};
const TYPE_NAME={mcq:'Multiple choice',tf:'True or false',match:'Matching',order:'Sequence',fill:'Fill in the blanks'};

function runQuiz(cfg){
  const queue=cfg.questions.map(q=>Object.assign({},q));
  const total=queue.length;
  const S={answered:0,first:0,xp:0,streak:0,lives:3,seen:0,extra:0};
  next();
  function topbar(){
    if(cfg.boss)return `<button class="iconbtn" id="x">✕</button><div class="bossface" id="bf">🗿</div><div class="bosshp"><div class="lab"><span>EXAM GUARDIAN</span><span class="hearts">${'❤️'.repeat(S.lives)}${'🖤'.repeat(3-S.lives)}</span></div><div class="bar"><i style="width:${(total-S.first)/total*100}%"></i></div></div>`;
    const denom=total+S.extra;
    return `<button class="iconbtn" id="x">✕</button><div class="prog"><i style="width:${S.seen/denom*100}%"></i></div><span class="xpb">⭐ ${S.xp}</span><span class="streak">${S.streak>=2?'🔥 x'+S.streak:''}</span>`;
  }
  function next(){
    if(!queue.length)return finish(true);
    const q=queue.shift();
    go(`<div class="qtop">${topbar()}</div><div class="card qcard"><div class="qmeta"><span class="chip">${cfg.boss?'Boss round':cfg.title}</span><span class="chip" style="color:#cfc8b3;border-color:rgba(255,255,255,.2)">${TYPE_NAME[q.type]}</span>${q.important?'<span class="imp">★ IMPORTANT</span>':''}${q._retry?'<span class="chip" style="color:var(--teal);border-color:var(--teal)">Second chance</span>':''}</div><div class="qtext">${esc(q.q)}</div><div id="body"></div></div><div id="sheetHost"></div>`);
    $('#x').onclick=()=>{if(confirm('Leave this quiz? Your progress in it will be lost.'))showMap()};
    R[q.type](q,$('#body'),ok=>answered(q,ok));
  }
  function answered(q,ok){
    let gain=0;
    if(!q._retry){S.answered++;if(ok){S.first++;S.streak++;gain=10+Math.min(S.streak-1,5)*2;S.xp+=gain}else S.streak=0}
    S.seen++;
    if(!ok){
      if(cfg.boss){S.lives--;const bf=$('#bf');if(bf)bf.textContent='😈'}
      else if(!q._retry){queue.push(Object.assign({},q,{_retry:true}));S.extra++}
    }else if(cfg.boss){const bf=$('#bf');if(bf){bf.classList.add('hit');bf.textContent='😵'}}
    ok?sfx.ok():sfx.bad();
    if(ok&&gain)xpPop('+'+gain+' XP');
    const dead=cfg.boss&&S.lives<=0;
    const last=!queue.length;
    const label=dead?'See result ▶':(last?'Finish ▶':'Continue ▶');
    $('#sheetHost').innerHTML=`<div class="sheet ${ok?'ok':'bad'}"><div class="in"><h3>${ok?(q._retry?'✅ Got it this time!':'✅ Correct!'):'❌ Not quite'}</h3><p>${esc(q.why)}</p><button class="btn" id="cont" style="width:100%">${label}</button></div></div>`;
    $('#cont').onclick=()=>{sfx.tap();dead?finish(false):next()};
  }
  function finish(won){
    const acc=S.first/total;
    cfg.onEnd({won,acc,first:S.first,total,xp:S.xp,lives:S.lives});
  }
}

/* ---- stage run + result ---- */
function startStage(li){
  const L=LESSONS[li];
  runQuiz({title:'Lesson '+(li+1),questions:shuffle(L.qs),boss:false,onEnd:r=>{
    const stars=r.acc>=.85?3:r.acc>=.6?2:1;
    const better=stars>(state.stars[L.id]||0);
    state.stars[L.id]=Math.max(stars,state.stars[L.id]||0);state.xp+=r.xp;save();
    showResult(li,r,stars,better);
  }});
}
function showResult(li,r,stars,better){

  const d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  go(`<div class="res"><h2 class="cz" style="font-size:1.6rem;color:var(--gold2)">🏆 Guardian Defeated!</h2><p>${r.first}/${r.total} correct · ${r.lives} ${r.lives===1?'life':'lives'} left · +100 bonus XP</p>
   <div class="cert"><div class="cz" style="letter-spacing:.3em;font-size:.7rem;color:var(--gold)">CERTIFICATE OF MASTERY</div><h2 style="margin:8px 0">Abbasid Scholar</h2><p style="font-size:.85rem">This certifies that</p>
    <input id="nm" maxlength="30" placeholder="Type your name" value="${esc(state.name||'')}"><p style="font-size:.85rem;margin-top:8px">has completed all seven lessons of the Abbasid era<br>and defeated the Exam Guardian.</p><div class="seal">🏅</div><p style="font-size:.75rem;color:#cfc8b3">${d} · Grade 8 Social Studies</p></div>
   <div class="row" style="justify-content:center"><button class="btn ghost" id="pr">🖨 Print / Save</button><button class="btn" id="mp">Back to map</button></div></div>`);
  $('#nm').oninput=e=>{state.name=e.target.value;save()};
  $('#pr').onclick=()=>window.print();$('#mp').onclick=showMap;
}

/* ---------- go! ---------- */
showIntro();
</script>
</body>
</html>
