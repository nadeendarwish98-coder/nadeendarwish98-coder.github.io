<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2B2140; --paper:#FFF9F0; --card:#fff; --sun:#FFC93C; --coral:#FF6B6B; --sky:#4EA8DE;
    --grass:#4CAF6D; --grape:#8E7CFF; --line:#EFE6D8; --muted:#6B6280; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Nunito',sans-serif; min-height:100vh; }
  .wrap{ max-width:820px; margin:0 auto; padding:28px 20px 80px; }
  .home{ display:inline-block; text-decoration:none; color:var(--grape); font-weight:800; margin-bottom:18px; }
  h1{ font-family:'Baloo 2',cursive; font-size:clamp(28px,5vw,40px); margin:0 0 6px; }
  .sub{ color:var(--muted); font-weight:600; margin:0 0 22px; }
  .video{ position:relative; aspect-ratio:16/9; border-radius:20px; overflow:hidden; background:#000;
    box-shadow:0 10px 28px rgba(43,33,64,.15); }
  .video iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  h2{ font-family:'Baloo 2',cursive; font-size:24px; margin:40px 0 12px; }
  .vocab{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .word{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; text-align:center; }
  .word .e{ font-size:30px; } .word b{ display:block; font-family:'Baloo 2',cursive; font-size:19px; }
  .word span{ color:var(--muted); font-size:14px; font-weight:600; }
  .games{ display:flex; gap:12px; flex-wrap:wrap; }
  .games a{ background:var(--grape); color:#fff; text-decoration:none; font-family:'Baloo 2',cursive; font-weight:700;
    padding:12px 20px; border-radius:999px; }
  .q{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:16px; }
  .q p{ margin:0 0 12px; font-weight:800; font-size:17px; }
  .opts{ display:grid; gap:10px; }
  .opt{ font:inherit; font-weight:700; text-align:left; padding:12px 16px; border-radius:14px; cursor:pointer;
    background:var(--paper); border:2px solid var(--line); color:var(--ink); }
  .opt:hover:not(:disabled){ border-color:var(--grape); }
  .opt.right{ background:#DFF5E5; border-color:var(--grass); }
  .opt.wrong{ background:#FFE1E1; border-color:var(--coral); }
  .score{ font-family:'Baloo 2',cursive; font-size:22px; text-align:center; margin-top:18px; min-height:32px; }
  .msg{ text-align:center; color:var(--muted); font-weight:700; padding:60px 0; }
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../index.html">← Home</a>
  <div id="app"><div class="msg">Loading…</div></div>
</div>
<script>
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=(new URLSearchParams(location.search).get('id')||'').replace(/[^a-z0-9_-]/gi,'');
const app=document.getElementById('app');

if(!id){ app.innerHTML='<div class="msg">No story selected.</div>'; }
else fetch(id+'.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(s=>{
  document.title=s.title+' — Nadeen\'s Learning Hub';
  let html=`<h1>${esc(s.title)}</h1><p class="sub">${esc(s.subtitle||'')}</p>`;
  if(s.youtube) html+=`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${esc(s.youtube)}" title="${esc(s.title)}" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  if((s.vocab||[]).length) html+=`<h2>New Words</h2><div class="vocab">${s.vocab.map(w=>`<div class="word"><div class="e">${esc(w.emoji||'')}</div><b>${esc(w.word)}</b><span>${esc(w.meaning||'')}</span></div>`).join('')}</div>`;
  if((s.games||[]).length) html+=`<h2>Play</h2><div class="games">${s.games.map(g=>`<a href="../${esc(g.url)}">${esc(g.title)}</a>`).join('')}</div>`;
  if((s.questions||[]).length) html+=`<h2>Questions</h2><div id="qs"></div><div class="score" id="score"></div>`;
  app.innerHTML=html;

  const qs=document.getElementById('qs'); if(!qs) return;
  let done=0, correct=0; const total=s.questions.length;
  s.questions.forEach((q,i)=>{
    const opts=q.type==='tf'?['True','False']:q.options;
    const ans=q.type==='tf'?(q.answer?0:1):q.answer;
    const box=document.createElement('div'); box.className='q';
    box.innerHTML=`<p>${i+1}. ${esc(q.q)}</p><div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}</div>`;
    box.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      const j=+b.dataset.j; const all=box.querySelectorAll('.opt');
      all.forEach(x=>x.disabled=true);
      all[ans].classList.add('right'); if(j!==ans) b.classList.add('wrong'); else correct++;
      done++; if(done===total) document.getElementById('score').textContent=`⭐ You got ${correct} out of ${total}!`;
    }));
    qs.appendChild(box);
  });
}).catch(()=>{ app.innerHTML='<div class="msg">Story not found.</div>'; });
</script>
</body>
</html>
