<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 Seconds Challenge!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B0E2E;
    --bg2:#2A1748;
    --magenta:#FF3E7F;
    --gold:#FFC93C;
    --teal:#06D6A0;
    --coral:#FF6B4A;
    --cream:#FFF8EF;
    --line:#4A2E70;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(255,62,127,0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(6,214,160,0.15), transparent 45%),
      var(--bg);
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    color:var(--cream);
    display:flex;
    justify-content:center;
    padding:18px 12px 40px;
  }
  .stage{ width:100%; max-width:680px; }

  /* Marquee header */
  .marquee{
    position:relative;
    background:var(--bg2);
    border:3px solid var(--line);
    border-radius:22px;
    padding:16px 14px;
    text-align:center;
    overflow:hidden;
    margin-bottom:16px;
  }
  .lights{ position:absolute; top:8px; left:0; right:0; display:flex; justify-content:space-evenly; padding:0 10px; }
  .lights span{ width:7px;height:7px;border-radius:50%; background:var(--gold); animation:twinkle 1.4s infinite ease-in-out; box-shadow:0 0 6px var(--gold); }
  .lights span:nth-child(odd){animation-delay:.35s; background:var(--magenta); box-shadow:0 0 6px var(--magenta);}
  .lights span:nth-child(3n){animation-delay:.7s; background:var(--teal); box-shadow:0 0 6px var(--teal);}
  @keyframes twinkle{0%,100%{opacity:.3; transform:scale(.8);}50%{opacity:1; transform:scale(1.15);}}
  .marquee h1{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(26px,7vw,40px); margin:20px 0 2px; letter-spacing:.5px; text-shadow:3px 3px 0 rgba(0,0,0,.25); }
  .marquee h1 .accent{color:var(--gold);}
  .marquee p.tag{ margin:0 0 8px; font-weight:700; font-size:14px; color:var(--teal); }

  .topbar{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .pill{ background:var(--bg2); border:2px solid var(--line); border-radius:999px; padding:8px 16px; font-weight:800; font-family:'Baloo 2',sans-serif; font-size:15px; display:flex; align-items:center; gap:6px; }
  .pill.score{color:var(--gold);}
  .iconbtn{ cursor:pointer; background:var(--bg2); border:2px solid var(--line); color:var(--cream); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:700; }
  .iconbtn:active{transform:scale(.96);}

  /* Nav row (always-available Home / Previous / All Questions) */
  .navrow{ display:flex; gap:8px; margin-bottom:12px; }
  .navrow .navbtn{
    flex:1; border:2px solid var(--line); background:var(--bg2); color:var(--cream);
    border-radius:14px; padding:11px 6px; font-family:'Baloo 2',sans-serif; font-weight:700;
    font-size:13px; cursor:pointer; transition:transform .12s ease;
  }
  .navrow .navbtn:active{transform:scale(.94);}
  .navrow .navbtn[disabled]{opacity:.35; cursor:not-allowed;}

  /* Level select */
  .levels{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .level-card{
    border:none; border-radius:18px; padding:16px 10px; cursor:pointer;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; color:var(--bg);
    text-align:left; position:relative; transition:transform .12s ease; line-height:1.25;
  }
  .level-card:active{transform:scale(.96);}
  .level-card .emoji{font-size:22px; display:block; margin-bottom:4px;}
  .level-card .sub{ display:block; font-family:'Nunito',sans-serif; font-weight:700; font-size:11.5px; opacity:.75; margin-top:2px; }
  .lvl1{background:var(--teal);}
  .lvl2{background:var(--gold);}
  .lvl3{background:#B78BFF;}
  .lvl4{background:var(--coral);}
  .lvl5{background:#5FC8FF;}
  .lvl6{background:#FF6FA5;}
  .lvl7{grid-column:1 / -1; background:linear-gradient(135deg,var(--magenta),var(--gold)); color:var(--bg); text-align:center;}

  /* Question hub grid */
  .hub-title{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px; margin:4px 0 12px; text-align:center; }
  .qgrid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:14px; }
  .qbtn{
    aspect-ratio:1; border:none; border-radius:12px; cursor:pointer;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; color:var(--bg);
    background:var(--gold); position:relative; transition:transform .12s ease;
  }
  .qbtn:active{transform:scale(.9);}
  .qbtn.done{ background:#3a2760; color:var(--cream); border:2px solid var(--teal); }
  .qbtn.done::after{ content:'✓'; position:absolute; top:1px; right:4px; font-size:10px; color:var(--teal); }

  /* Stage card */
  .card{
    background:var(--bg2); border:3px dashed var(--line); border-radius:24px; padding:26px 20px;
    text-align:center; min-height:200px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; position:relative;
  }
  .card .eyebrow{ font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--gold); font-size:13px; letter-spacing:.4px; }
  .challenge-text{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(19px,5.4vw,26px); line-height:1.35; max-width:520px; }
  .timer{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:96px; color:var(--gold); line-height:1; text-shadow:0 0 30px rgba(255,201,60,.5); }
  .timer.pulse{animation:pulse .5s ease;}
  @keyframes pulse{0%{transform:scale(1);}40%{transform:scale(1.25);}100%{transform:scale(1);}}
  .result{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(24px,6vw,34px); }
  .idle-hint{ color:#B7A6D9; font-weight:700; font-size:14px; }
  .qnum-tag{ font-weight:800; font-family:'Baloo 2',sans-serif; color:var(--teal); font-size:13px; }

  /* Controls */
  .controls{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .btn{
    flex:1; min-width:130px; border:none; border-radius:16px; padding:16px 12px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; cursor:pointer;
    transition:transform .12s ease; color:var(--bg);
  }
  .btn:active{transform:scale(.95);}
  .btn-start{background:var(--magenta); color:var(--cream);}
  .btn-go{background:var(--gold);}
  .btn-next{background:var(--teal);}
  .btn-back{background:transparent; border:2px solid var(--line); color:var(--cream); flex:none; padding:16px 18px;}
  .btn-nailed{background:var(--teal);}
  .btn-almost{background:#3a2760; color:var(--cream); border:2px solid var(--line);}
  .btn-ghost{background:transparent; border:2px solid var(--line); color:var(--cream);}
  .btn[disabled]{opacity:.4; cursor:not-allowed;}
  .grade-row{display:flex; gap:10px; width:100%;}

  /* Progress */
  .progress-wrap{margin-top:16px;}
  .progress-label{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:#B7A6D9; margin-bottom:6px; display:flex; justify-content:space-between; }

  /* Confetti */
  .confetti-piece{ position:fixed; top:-20px; width:9px;height:14px; opacity:.95; z-index:50; pointer-events:none; border-radius:2px; }

  .final{ text-align:center; padding:30px 10px; }
  .final .trophy{font-size:70px;}
  .final h2{ font-family:'Baloo 2',sans-serif; font-size:28px; }
  .final .finalscore{ font-family:'Baloo 2',sans-serif; font-size:44px; color:var(--gold); margin:6px 0 18px; }
  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){ .lights span, .timer.pulse{animation:none !important;} }
</style>
</head>
<body>
<div class="stage">

  <div class="marquee">
    <div class="lights">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <h1>5 <span class="accent">SECONDS</span> CHALLENGE!</h1>
    <p class="tag">⏰ THE FIRST-DAY GAME SHOW 🔥</p>
  </div>

  <div class="topbar">
    <div class="pill score">⭐ <span id="scoreVal">0</span> pts</div>
    <button class="iconbtn" id="soundToggle">🔊 Music On</button>
  </div>

  <!-- LEVEL SELECT SCREEN -->
  <div id="levelSelect">
    <div class="levels">
      <button class="level-card lvl1" data-level="easy"><span class="emoji">🟢</span>EASY<span class="sub">Letters &amp; words</span></button>
      <button class="level-card lvl2" data-level="thinkfast"><span class="emoji">🟡</span>THINK FAST!<span class="sub">Quick sentences</span></button>
      <button class="level-card lvl3" data-level="memory"><span class="emoji">🟠</span>MEMORY<span class="sub">Remember it!</span></button>
      <button class="level-card lvl4" data-level="actitout"><span class="emoji">🔵</span>ACT IT OUT<span class="sub">Get moving!</span></button>
      <button class="level-card lvl5" data-level="brain"><span class="emoji">🟣</span>BRAIN BOOSTER<span class="sub">Numbers &amp; shapes</span></button>
      <button class="level-card lvl6" data-level="crazy"><span class="emoji">🔴</span>CRAZY!<span class="sub">Silly &amp; funny</span></button>
      <button class="level-card lvl7" data-level="super">🏆 CAN YOU BEAT 5 SECONDS? <span class="sub">Super Challenge — the hardest round!</span></button>
    </div>
    <div class="controls">
      <button class="btn btn-back" id="endGameBtn">🏁 End Game</button>
    </div>
  </div>

  <!-- QUESTION HUB (pick any question) -->
  <div id="questionHub" class="hidden">
    <div class="navrow">
      <button class="navbtn" id="hubHomeBtn">🏠 Home</button>
    </div>
    <div class="hub-title" id="hubTitle">EASY — pick a question</div>
    <div class="progress-wrap" style="margin-top:0; margin-bottom:12px;">
      <div class="progress-label"><span id="hubProgressText">0 / 20 answered</span><span id="hubBadge">🟢 EASY</span></div>
    </div>
    <div class="qgrid" id="qgrid"></div>
    <div class="controls">
      <button class="btn btn-start" id="randomBtn">🎲 Surprise Me!</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden">
    <div class="navrow">
      <button class="navbtn" id="homeBtn">🏠 Home</button>
      <button class="navbtn" id="prevBtn">◀ Previous</button>
      <button class="navbtn" id="allQBtn">🔢 All Questions</button>
    </div>

    <div class="card" id="card">
      <div class="eyebrow" id="levelName">EASY</div>
      <div class="qnum-tag" id="qNumTag">Question 3</div>
      <div class="idle-hint hidden" id="idleHint">Ready? Tap REVEAL to show the challenge!</div>
      <div class="challenge-text hidden" id="challengeText"></div>
      <div class="timer hidden" id="timerDisplay">5</div>
      <div class="result hidden" id="resultText"></div>
    </div>

    <div class="controls" id="revealControls">
      <button class="btn btn-start" id="revealBtn">👀 REVEAL</button>
    </div>
    <div class="controls hidden" id="goControls">
      <button class="btn btn-go" id="goBtn">⏰ GO! 5 SECONDS</button>
    </div>
    <div class="controls hidden grade-row" id="gradeControls">
      <button class="btn btn-nailed" id="nailedBtn">✅ Nailed it!</button>
      <button class="btn btn-almost" id="almostBtn">😅 Almost!</button>
    </div>
    <div class="controls hidden" id="nextControls">
      <button class="btn btn-ghost" id="backToGridBtn">🔢 All Questions</button>
      <button class="btn btn-next" id="nextRandomBtn">🎲 Next Random</button>
    </div>
  </div>

  <!-- FINAL SCREEN -->
  <div id="finalScreen" class="hidden">
    <div class="card final">
      <div class="trophy">🏆</div>
      <h2>5-SECOND SUPERSTAR!</h2>
      <div class="finalscore"><span id="finalScoreVal">0</span> points</div>
      <div class="controls">
        <button class="btn btn-start" id="playAgainBtn">🔄 Play Again</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ---------------- CHALLENGE DATA ---------------- */
const LEVELS = {
  easy: { label:"🟢 EASY", name:"EASY", cls:"lvl1", list:[
    "Say the alphabet from A to G.","Say 3 words that start with B.","Say 3 words that start with S.",
    "Say 3 words that rhyme with \u201Ccat.\u201D","Say 3 words with the /sh/ sound.","Say 3 words with the /ch/ sound.",
    "Say 3 verbs.","Say 3 adjectives.","Say 3 nouns.","Say 3 words with two syllables.",
    "Spell the word BOOK.","Spell the word SCHOOL.","Say the opposite of big.","Say the opposite of hot.",
    "Say the opposite of fast.","Say a synonym for happy.","Say a synonym for big.","Say the plural of child.",
    "Say the plural of mouse.","Say the past tense of go."
  ]},
  thinkfast: { label:"🟡 THINK FAST!", name:"THINK FAST!", cls:"lvl2", list:[
    "Complete: I am ___ years old.","Complete: Yesterday, I ___.","Complete: I have ___.",
    "Make a sentence with the word \u201Cbecause.\u201D","Make a sentence with the word \u201Cbut.\u201D",
    "Say a sentence in the Present Simple.","Say a sentence in the Past Simple.","Say a sentence using \u201Ccan.\u201D",
    "Turn \u201CShe likes pizza.\u201D into a negative sentence.","Turn \u201CHe plays football.\u201D into a question.",
    "Say a word that has the same beginning sound as \u201Csun.\u201D","Say a word that rhymes with \u201Ccake.\u201D",
    "Say a word that rhymes with \u201Ctree.\u201D","Say 3 irregular verbs.","Say 3 regular verbs.",
    "Say 3 words that contain the letter X.","Say 3 words that contain double letters.",
    "Say 3 words ending in -ing.","Say 3 words ending in -ed.","Say 3 words with the long A sound."
  ]},
  memory: { label:"🟠 MEMORY", name:"MEMORY CHALLENGE 🧠", cls:"lvl3", list:[
    "Remember these 3 words and repeat them: apple \u2013 train \u2013 moon","Remember these 4 numbers: 7 \u2013 2 \u2013 9 \u2013 4",
    "Remember this sentence and repeat it: The little dog is running.","Listen to 3 words and say them backwards.",
    "The teacher says 3 actions. Repeat them in the same order.","Remember these colors: red \u2013 green \u2013 purple \u2013 yellow",
    "Repeat this sequence: clap \u2013 clap \u2013 jump \u2013 clap","Remember 4 letters: B \u2013 M \u2013 T \u2013 S",
    "The teacher says 3 words. Say the second word.","The teacher says 4 numbers. Say the last number."
  ]},
  actitout: { label:"🔵 ACT IT OUT", name:"ACT IT OUT! 😂", cls:"lvl4", list:[
    "Act like you are walking on the Moon. 🌙","Pretend you are a robot for 5 seconds. 🤖","Pretend you are a famous singer. 🎤",
    "Walk like a penguin. 🐧","Pretend you are extremely sleepy. 😴","Pretend you just won a huge prize! 🏆",
    "Freeze like a statue! 🗿","Pretend you are running in slow motion.","Do your best superhero pose! 🦸",
    "Pretend you are talking on a giant phone. 📱","Act like you just saw something surprising! 😲",
    "Pretend you are a news reporter. 🎤","Pretend you are a teacher for 5 seconds. 👩\u200D🏫",
    "Do 5 quick claps. 👏","Touch your head, shoulders, knees, and toes in order."
  ]},
  brain: { label:"🟣 BRAIN", name:"BRAIN BOOSTER 🧠🔥", cls:"lvl5", list:[
    "What comes after 19?","What comes before 50?","Count backwards from 10 to 1.","Say 5, 10, 15, 20...",
    "What is 2 + 3?","What is 10 - 4?","What number comes between 7 and 9?","Say 3 even numbers.",
    "Say 3 odd numbers.","Name 3 shapes.","Name 3 things that are round.","Name 3 things that can fly.",
    "Name 3 things that can move.","Name 3 things you can read.","Name 3 things that make a sound."
  ]},
  crazy: { label:"🔴 CRAZY", name:"CRAZY 5 SECONDS! 🤪", cls:"lvl6", list:[
    "Say your name in a robot voice.","Say \u201CGood morning!\u201D like a superhero.","Say the alphabet while clapping.",
    "Make your best surprised face.","Give the camera your biggest smile.","Say 3 words without using the letter A.",
    "Say one sentence as quickly as you can.","Say a tongue-twister as fast as possible.",
    "Pretend you are stuck in an invisible box.","Make your best \u201Cthinking face.\u201D 🤔",
    "Say \u201CI love school!\u201D in a funny voice.","Pretend the floor is lava! 🌋","Do your best victory celebration! 🏆",
    "Make a heart with your hands. ❤️","Give yourself a round of applause! 👏"
  ]},
  super: { label:"🏆 SUPER", name:"CAN YOU BEAT 5 SECONDS?", cls:"lvl7", list:[
    "Say 5 animals in 5 seconds.","Say 5 verbs in 5 seconds.","Say 5 adjectives in 5 seconds.",
    "Say 5 words starting with S.","Spell a difficult Grade 4 word.","Say 5 words that rhyme with \u201Cday.\u201D",
    "Say 5 words containing the letter T.","Count backwards from 20 to 10.","Make a sentence using 3 given words.",
    "Complete a sentence before the timer reaches zero!"
  ]}
};
const SUCCESS_LINES = ["🎉 Awesome!","⭐ Great job!","😂 That was close!","🔥 You were super fast!","🌟 Fantastic!","🎊 You did it!"];
const TIMEUP_LINES = ["⏰ TIME'S UP!","🚨 TIME'S UP!","⌛ TIME'S UP!"];

/* ---------------- STATE ---------------- */
let score = 0;
let currentLevelKey = null;
let currentIndex = null;      // index into LEVELS[key].list
let historyStack = [];        // indices visited, for Previous
let completedByLevel = {};    // { levelKey: Set(indices) }
let countdownTimer = null;
let musicOn = true;
let audioStarted = false;

function el(id){ return document.getElementById(id); }
function getCompletedSet(key){
  if(!completedByLevel[key]) completedByLevel[key] = new Set();
  return completedByLevel[key];
}

/* ---------------- AUDIO ENGINE (Web Audio API, no external files) ---------------- */
let actx = null;
function ensureAudio(){
  if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(actx.state === 'suspended'){ actx.resume(); }
}
function beep(freq, dur=0.12, type='square', vol=0.18, when=0){
  ensureAudio();
  const t = actx.currentTime + when;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(actx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}
function tickSound(){ beep(880,0.09,'square',0.15); }
function successSound(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>beep(f,0.16,'triangle',0.2,i*0.09)); }
function buzzSound(){ beep(160,0.35,'sawtooth',0.18); beep(120,0.4,'sawtooth',0.15,0.08); }
function clickSound(){ beep(600,0.05,'square',0.1); }

/* Procedural background chiptune loop */
let musicStep = 0;
let musicIntervalId = null;
const MELODY = [523.25,0,659.25,783.99,0,659.25,880,783.99,0,659.25,523.25,0,587.33,659.25,0,523.25];
const BASS =   [130.81,0,130.81,0,164.81,0,164.81,0,146.83,0,146.83,0,196.00,0,196.00,0];
function playMusicStep(){
  if(!musicOn) return;
  ensureAudio();
  const t = actx.currentTime;
  const m = MELODY[musicStep % MELODY.length];
  const b = BASS[musicStep % BASS.length];
  if(m>0){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.setValueAtTime(m,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.045,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.2);
  }
  if(b>0){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(b,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.06,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.24);
  }
  musicStep++;
}
function startMusic(){ if(musicIntervalId) return; ensureAudio(); musicIntervalId = setInterval(playMusicStep, 220); }
function stopMusic(){ if(musicIntervalId){ clearInterval(musicIntervalId); musicIntervalId=null; } }

/* ---------------- CONFETTI ---------------- */
function launchConfetti(){
  const colors = ['#FF3E7F','#FFC93C','#06D6A0','#FF6B4A','#B78BFF','#5FC8FF'];
  for(let i=0;i<32;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    const duration = 1400 + Math.random()*900;
    const drift = (Math.random()-0.5)*160;
    p.animate([
      { transform:`translate(0,0) rotate(0deg)`, opacity:1 },
      { transform:`translate(${drift}px, 100vh) rotate(${360+Math.random()*360}deg)`, opacity:0.9 }
    ], { duration, easing:'ease-in' });
    setTimeout(()=>p.remove(), duration+50);
  }
}

/* ---------------- COUNTDOWN CLEANUP (prevents runaway timers / leftover beeps) ---------------- */
function cleanupCountdown(){
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
}

/* ---------------- SCREEN CONTROL ---------------- */
function hideAllScreens(){
  el('levelSelect').classList.add('hidden');
  el('questionHub').classList.add('hidden');
  el('gameScreen').classList.add('hidden');
  el('finalScreen').classList.add('hidden');
}
function showLevelSelect(){
  cleanupCountdown();
  currentLevelKey = null;
  currentIndex = null;
  historyStack = [];
  hideAllScreens();
  el('levelSelect').classList.remove('hidden');
}
function openHub(key){
  clickSound();
  cleanupCountdown();
  currentLevelKey = key;
  currentIndex = null;
  historyStack = [];
  hideAllScreens();
  el('questionHub').classList.remove('hidden');
  el('hubTitle').textContent = LEVELS[key].name + ' — pick a question';
  el('hubBadge').textContent = LEVELS[key].label;
  renderGrid();
}
function renderGrid(){
  const key = currentLevelKey;
  const list = LEVELS[key].list;
  const done = getCompletedSet(key);
  const grid = el('qgrid');
  grid.innerHTML = '';
  list.forEach((_, i)=>{
    const b = document.createElement('button');
    b.className = 'qbtn ' + (done.has(i) ? 'done' : LEVELS[key].cls);
    b.textContent = i+1;
    b.addEventListener('click', ()=> goToQuestion(i, true));
    grid.appendChild(b);
  });
  el('hubProgressText').textContent = `${done.size} / ${list.length} answered`;
}
function goToQuestion(idx, fromHub){
  clickSound();
  cleanupCountdown();
  if(!fromHub && currentIndex !== null){ historyStack.push(currentIndex); }
  currentIndex = idx;
  hideAllScreens();
  el('gameScreen').classList.remove('hidden');
  renderIdleQuestion();
}
function renderIdleQuestion(){
  const key = currentLevelKey;
  el('levelName').textContent = LEVELS[key].name;
  el('qNumTag').textContent = `Question ${currentIndex+1} of ${LEVELS[key].list.length}`;
  el('idleHint').classList.remove('hidden');
  el('challengeText').classList.add('hidden');
  el('timerDisplay').classList.add('hidden');
  el('resultText').classList.add('hidden');
  el('revealControls').classList.remove('hidden');
  el('goControls').classList.add('hidden');
  el('gradeControls').classList.add('hidden');
  el('nextControls').classList.add('hidden');
  el('prevBtn').disabled = historyStack.length === 0;
}
function revealChallenge(){
  clickSound();
  const text = LEVELS[currentLevelKey].list[currentIndex];
  el('idleHint').classList.add('hidden');
  el('challengeText').textContent = text;
  el('challengeText').classList.remove('hidden');
  el('revealControls').classList.add('hidden');
  el('goControls').classList.remove('hidden');
}
function beginCountdown(){
  clickSound();
  el('goControls').classList.add('hidden');
  el('timerDisplay').classList.remove('hidden');
  let n = 5;
  el('timerDisplay').textContent = n;
  tickSound();
  cleanupCountdown();
  countdownTimer = setInterval(()=>{
    n--;
    if(n>0){
      el('timerDisplay').textContent = n;
      el('timerDisplay').classList.remove('pulse'); void el('timerDisplay').offsetWidth; el('timerDisplay').classList.add('pulse');
      tickSound();
    } else {
      cleanupCountdown();
      timeUp();
    }
  }, 1000);
}
function timeUp(){
  buzzSound();
  el('timerDisplay').classList.add('hidden');
  el('challengeText').classList.add('hidden');
  const line = TIMEUP_LINES[Math.floor(Math.random()*TIMEUP_LINES.length)];
  el('resultText').textContent = line;
  el('resultText').classList.remove('hidden');
  el('gradeControls').classList.remove('hidden');
}
function gradeChallenge(nailed){
  clickSound();
  getCompletedSet(currentLevelKey).add(currentIndex);
  if(nailed){
    score++;
    el('scoreVal').textContent = score;
    successSound();
    launchConfetti();
    el('resultText').textContent = SUCCESS_LINES[Math.floor(Math.random()*SUCCESS_LINES.length)];
  }
  el('gradeControls').classList.add('hidden');
  el('nextControls').classList.remove('hidden');
}
function goPrevious(){
  if(historyStack.length === 0) return;
  clickSound();
  cleanupCountdown();
  currentIndex = historyStack.pop();
  renderIdleQuestion();
}
function pickRandomQuestion(){
  const list = LEVELS[currentLevelKey].list;
  let idx;
  if(list.length === 1){ idx = 0; }
  else {
    do { idx = Math.floor(Math.random()*list.length); } while(idx === currentIndex);
  }
  goToQuestion(idx, currentIndex === null);
}
function endGame(){
  clickSound();
  cleanupCountdown();
  hideAllScreens();
  el('finalScreen').classList.remove('hidden');
  el('finalScoreVal').textContent = score;
  launchConfetti();
  successSound();
}
function playAgain(){
  clickSound();
  score = 0;
  el('scoreVal').textContent = score;
  completedByLevel = {};
  showLevelSelect();
}

/* ---------------- EVENT WIRING ---------------- */
document.querySelectorAll('.level-card').forEach(btn=>{
  btn.addEventListener('click', ()=> openHub(btn.dataset.level));
});
el('endGameBtn').addEventListener('click', endGame);
el('hubHomeBtn').addEventListener('click', showLevelSelect);
el('randomBtn').addEventListener('click', pickRandomQuestion);

el('homeBtn').addEventListener('click', showLevelSelect);
el('prevBtn').addEventListener('click', goPrevious);
el('allQBtn').addEventListener('click', ()=> openHub(currentLevelKey));
el('backToGridBtn').addEventListener('click', ()=> openHub(currentLevelKey));
el('nextRandomBtn').addEventListener('click', pickRandomQuestion);

el('revealBtn').addEventListener('click', revealChallenge);
el('goBtn').addEventListener('click', beginCountdown);
el('nailedBtn').addEventListener('click', ()=>gradeChallenge(true));
el('almostBtn').addEventListener('click', ()=>gradeChallenge(false));
el('playAgainBtn').addEventListener('click', playAgain);

el('soundToggle').addEventListener('click', ()=>{
  ensureAudio();
  musicOn = !musicOn;
  el('soundToggle').textContent = musicOn ? '🔊 Music On' : '🔇 Music Off';
  if(musicOn){ startMusic(); } else { stopMusic(); }
});

/* Start music on first user interaction (required by browser audio policies) */
document.body.addEventListener('click', ()=>{
  if(!audioStarted){ ensureAudio(); startMusic(); audioStarted = true; }
});
</script>
</body>
</html>
